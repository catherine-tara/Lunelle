<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lunelle — My Beauty Diary</title>
<style>
:root{
  --pink:#f6c9dc;
  --pink-dark:#d98faf;
  --pink-soft:#fff0f6;
  --blue:#cfe4f7;
  --blue-dark:#82acd0;
  --purple:#ded3f4;
  --purple-dark:#a996cf;
  --lavender:#f4f0fb;
  --cream:#fffafc;
  --white:#fff;
  --text:#51464f;
  --muted:#9b8e99;
  --border:#eadde5;
  --green:#cfe9dc;
  --green-dark:#78a990;
  --yellow:#f7e7bd;
  --red:#efb6c2;
  --shadow:0 14px 35px rgba(150,120,145,.10);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(135deg,#fff9fc 0%,#f7f3fb 48%,#f1f7fc 100%);
  color:var(--text);
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{min-height:100vh}
.mobile-topbar{display:none}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:255px;
  padding:30px 18px 20px;
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(18px);
  border-right:1px solid rgba(234,221,229,.9);
  z-index:100;
  overflow-y:auto;
}

.sidebar-brand{padding:4px 10px 25px}

.logo{
  width:46px;
  height:46px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,var(--pink),var(--purple));
  color:white;
  font-family:Georgia,serif;
  font-size:25px;
  box-shadow:0 8px 20px rgba(217,143,175,.18);
}

.brand-name{
  margin:12px 0 2px;
  font:30px Georgia,serif;
  color:#62515e;
}

.brand-sub{
  font-size:9px;
  letter-spacing:2px;
  color:var(--muted);
}

.nav-section{margin:18px 0}

.nav-label{
  font-size:8px;
  letter-spacing:2px;
  font-weight:800;
  color:#b09fa9;
  padding:0 11px 8px;
}

.nav-btn{
  width:100%;
  border:0;
  background:transparent;
  text-align:left;
  padding:10px 12px;
  border-radius:13px;
  color:#756774;
  font-size:12px;
  display:flex;
  align-items:center;
  gap:10px;
  margin:2px 0;
  transition:.2s;
}

.nav-btn:hover{background:var(--pink-soft)}

.nav-btn.active{
  background:linear-gradient(90deg,#fff0f6,#f6f1fc);
  color:#9a5e79;
  font-weight:700;
}

.nav-icon{
  width:18px;
  text-align:center;
}

.sidebar-footer{
  padding:20px 10px 5px;
  color:#b2a3ad;
  font-size:8px;
  letter-spacing:1px;
  text-align:center;
}

/* =========================
   MAIN
========================= */

.main{
  margin-left:255px;
  min-height:100vh;
  padding:38px 42px 60px;
}

.page-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:20px;
  margin-bottom:30px;
}

.eyebrow{
  font-size:8px;
  letter-spacing:3px;
  color:var(--pink-dark);
  font-weight:800;
}

h1{
  font:42px Georgia,serif;
  margin:7px 0 3px;
  color:#5b4b58;
}

.page-sub{
  font-size:12px;
  color:var(--muted);
}

.header-actions{
  display:flex;
  gap:8px;
}

.btn{
  border:1px solid var(--border);
  background:white;
  color:#735f6c;
  padding:10px 15px;
  border-radius:12px;
  font-size:11px;
  font-weight:700;
  box-shadow:0 5px 15px rgba(130,100,120,.06);
}

.btn.primary{
  background:linear-gradient(135deg,#f5c5da,#d9c8ef);
  border-color:transparent;
  color:white;
}

.btn.danger{
  background:#fff1f3;
  color:#b76b79;
  border-color:#f1ccd3;
}

/* =========================
   DASHBOARD
========================= */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:25px;
}

.stat{
  background:rgba(255,255,255,.82);
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;
  box-shadow:var(--shadow);
}

.stat-label{
  font-size:8px;
  letter-spacing:1.8px;
  color:var(--muted);
  font-weight:800;
}

.stat-value{
  font:28px Georgia,serif;
  margin-top:8px;
  color:#64515e;
}

.stat-note{
  font-size:9px;
  color:#a99ba4;
  margin-top:3px;
}

.panel{
  background:rgba(255,255,255,.84);
  border:1px solid var(--border);
  border-radius:20px;
  padding:22px;
  box-shadow:var(--shadow);
  margin-bottom:18px;
}

.panel-title{
  font-size:10px;
  letter-spacing:2px;
  font-weight:900;
  color:#806b78;
  margin-bottom:16px;
}

.empty-state{
  text-align:center;
  padding:45px 20px;
  color:var(--muted);
  font-size:12px;
}

.product-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
}

.product-card{
  background:white;
  border:1px solid var(--border);
  border-radius:17px;
  padding:16px;
  cursor:pointer;
  transition:.2s;
  min-width:0;
}

.product-card:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 25px rgba(120,90,110,.10);
}

.product-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.product-name{
  font-weight:800;
  font-size:13px;
  line-height:1.35;
}

.product-brand{
  font-size:9px;
  color:var(--muted);
  margin-top:3px;
}

.badge{
  font-size:8px;
  font-weight:800;
  padding:5px 8px;
  border-radius:99px;
  white-space:nowrap;
}

.badge.yes{
  background:#e5f4eb;
  color:#5f9476;
}

.badge.maybe{
  background:#fff3d6;
  color:#a9853c;
}

.badge.no{
  background:#fde8ec;
  color:#b96c7d;
}

.badge.open{
  background:#edf3fa;
  color:#7193b0;
}

.badge.finished{
  background:#e7f2ed;
  color:#69947d;
}

.badge.decluttered{
  background:#f1edf5;
  color:#92839b;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:12px;
}

.meta-chip{
  background:#faf6f9;
  border:1px solid #eee5eb;
  border-radius:8px;
  padding:5px 7px;
  font-size:8px;
  color:#897a84;
}

.card-bottom{
  border-top:1px dashed var(--border);
  margin-top:13px;
  padding-top:11px;
  font-size:9px;
  color:var(--muted);
}

.shade-line{
  font-size:9px;
  margin-top:8px;
  color:#806b78;
}

.buy-line{
  margin-top:7px;
  font-weight:700;
  color:#7a6672;
}

/* =========================
   FORM
========================= */

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:17px;
}

.form-group.full{
  grid-column:1/-1;
}

.form-label{
  display:block;
  font-size:9px;
  letter-spacing:1px;
  text-transform:uppercase;
  color:#85727e;
  font-weight:800;
  margin-bottom:7px;
}

input[type=text],
input[type=date],
input[type=number],
select,
textarea,
.search-input{
  width:100%;
  border:1px solid var(--border);
  background:#fffdfd;
  color:var(--text);
  border-radius:11px;
  padding:11px 12px;
  outline:none;
  font-size:11px;
}

textarea{
  min-height:105px;
  resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#d9b6ca;
  box-shadow:0 0 0 3px rgba(246,201,220,.18);
}

.optional{
  font-size:8px;
  color:#aaa0a7;
  text-transform:none;
  letter-spacing:0;
  font-weight:500;
}

.search-wrap{
  position:relative;
}

.suggest-box{
  display:none;
  position:absolute;
  left:0;
  right:0;
  top:calc(100% + 4px);
  z-index:30;
  background:white;
  border:1px solid var(--border);
  border-radius:11px;
  padding:5px;
  box-shadow:0 12px 25px rgba(90,70,85,.12);
  max-height:180px;
  overflow:auto;
}

.suggest-box.show{
  display:block;
}

.suggest-item{
  padding:8px 9px;
  border-radius:8px;
  font-size:10px;
  cursor:pointer;
}

.suggest-item:hover{
  background:var(--pink-soft);
}

.inline-field{
  display:flex;
  gap:7px;
}

.inline-field .search-wrap{
  flex:1;
}

.inline-add{
  width:40px;
  flex:0 0 40px;
  border:1px solid var(--border);
  background:#fff0f6;
  color:#a45f7d;
  border-radius:10px;
  font-size:16px;
}

.radio-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.radio-option input{
  display:none;
}

.radio-option label{
  display:block;
  padding:10px 15px;
  border:1px solid var(--border);
  border-radius:11px;
  background:white;
  font-size:10px;
  cursor:pointer;
}

.radio-option input:checked+label{
  background:#fff0f6;
  border-color:#e3b3c8;
  color:#a35f7c;
  font-weight:800;
}

.shade-section{
  display:none;
  padding:15px;
  background:#fbf7fb;
  border:1px solid #eee3eb;
  border-radius:14px;
  margin-top:2px;
}

.shade-section.show{
  display:block;
}

.status-extra{
  display:none;
  margin-top:9px;
}

.status-extra.show{
  display:block;
}

.usage-summary{
  display:none;
  margin-top:10px;
  padding:10px 12px;
  background:#eef8f2;
  border-radius:10px;
  color:#638773;
  font-size:10px;
}

.usage-summary.show{
  display:block;
}

.buy-again-wrap{
  display:none;
  margin-top:12px;
}

.buy-again-wrap.show{
  display:block;
}

.checkbox-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}

.check-option{
  position:relative;
}

.check-option input{
  display:none;
}

.check-option label{
  display:block;
  border:1px solid var(--border);
  border-radius:10px;
  padding:9px 10px;
  background:white;
  font-size:10px;
  cursor:pointer;
}

.check-option input:checked+label{
  background:#f3effa;
  border-color:#cdbce5;
  color:#79669a;
  font-weight:700;
}

.form-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:20px;
}

/* =========================
   PROFILE
========================= */

.profile-layout{
  display:grid;
  grid-template-columns:1fr 1.2fr;
  gap:18px;
}

.profile-card{
  background:white;
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
}

.profile-row{
  display:flex;
  justify-content:space-between;
  gap:20px;
  padding:11px 0;
  border-bottom:1px dashed var(--border);
}

.profile-row:last-child{
  border-bottom:0;
}

.profile-key{
  font-size:9px;
  color:var(--muted);
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:1px;
}

.profile-value{
  text-align:right;
  font-size:11px;
  font-weight:700;
}

.condition-tags,
.shade-list{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.tag{
  background:#f7f1fa;
  border:1px solid #e8ddef;
  color:#806b91;
  padding:6px 8px;
  border-radius:99px;
  font-size:9px;
}

.shade-match{
  padding:12px 0;
  border-bottom:1px dashed var(--border);
}

.shade-match:last-child{
  border-bottom:0;
}

.shade-match strong{
  font-size:11px;
}

.shade-match small{
  display:block;
  color:var(--muted);
  font-size:9px;
  margin-top:3px;
}

/* =========================
   SETTINGS
========================= */

.settings-tabs{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-bottom:5px;
  margin-bottom:18px;
}

.settings-tab{
  border:1px solid var(--border);
  background:white;
  border-radius:99px;
  padding:9px 15px;
  font-size:10px;
  color:#816e7b;
  white-space:nowrap;
}

.settings-tab.active{
  background:#fff0f6;
  color:#a35f7c;
  border-color:#e7b8cb;
  font-weight:800;
}

.setting-panel{
  display:none;
}

.setting-panel.active{
  display:block;
}

.manage-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.manage-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border:1px solid var(--border);
  border-radius:11px;
  padding:10px 12px;
  background:white;
  font-size:10px;
}

.remove-mini{
  border:0;
  background:#fff0f3;
  color:#b76f7e;
  border-radius:7px;
  padding:5px 8px;
  font-size:9px;
}

/* =========================
   MODAL
========================= */

.modal-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(68,52,66,.28);
  z-index:200;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-overlay.show{
  display:flex;
}

.modal{
  width:min(650px,100%);
  max-height:90vh;
  overflow:auto;
  background:#fffafd;
  border:1px solid var(--border);
  border-radius:22px;
  padding:24px;
  box-shadow:0 25px 70px rgba(70,50,70,.2);
}

.modal-head{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:flex-start;
}

.close{
  border:0;
  background:#f7eef4;
  border-radius:50%;
  width:32px;
  height:32px;
  color:#806d79;
}

.detail-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:18px 0;
}

.detail{
  background:white;
  border:1px solid var(--border);
  border-radius:11px;
  padding:11px;
}

.detail small{
  display:block;
  color:var(--muted);
  font-size:8px;
  text-transform:uppercase;
  letter-spacing:1px;
}

.detail strong{
  display:block;
  margin-top:5px;
  font-size:10px;
}

.modal-notes{
  background:#fff5f9;
  border-radius:12px;
  padding:13px;
  font-size:10px;
  line-height:1.6;
}

.modal-actions{
  display:flex;
  gap:8px;
  justify-content:flex-end;
  margin-top:18px;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#665564;
  color:white;
  padding:11px 15px;
  border-radius:12px;
  font-size:10px;
  z-index:500;
  opacity:0;
  transform:translateY(10px);
  pointer-events:none;
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translateY(0);
}

/* =========================
   MOBILE
========================= */

@media(max-width:768px){

  .sidebar{
    width:275px;
    transform:translateX(-105%);
    transition:transform .25s ease;
    box-shadow:15px 0 40px rgba(70,50,70,.13);
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .sidebar-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(50,40,50,.22);
    z-index:90;
  }

  .sidebar-overlay.show{
    display:block;
  }

  .mobile-topbar{
    display:flex;
    position:sticky;
    top:0;
    z-index:80;
    height:62px;
    align-items:center;
    justify-content:flex-start;
    padding:0 15px;
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
  }

  /* HAMBURGER IS ON THE LEFT */
  .hamburger{
    width:40px;
    height:40px;
    border:1px solid var(--border);
    border-radius:12px;
    background:white;
    color:#866e7c;
    font-size:20px;
    display:grid;
    place-items:center;
  }

  .mobile-title{
    margin-left:11px;
    font:20px Georgia,serif;
    color:#655461;
  }

  .main{
    margin-left:0;
    padding:24px 15px 45px;
  }

  .page-header{
    align-items:flex-start;
    margin-bottom:20px;
  }

  .page-header .header-actions{
    display:none;
  }

  h1{
    font-size:32px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .product-grid{
    grid-template-columns:1fr;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .form-group.full{
    grid-column:auto;
  }

  .profile-layout{
    grid-template-columns:1fr;
  }

  .checkbox-grid{
    grid-template-columns:1fr;
  }
}

</style>
</head>

<body>

<div class="app">

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<aside class="sidebar" id="sidebar">

  <div class="sidebar-brand">
    <div class="logo">L</div>
    <div class="brand-name">Lunelle</div>
    <div class="brand-sub">MY BEAUTY DIARY ♡</div>

  <div class="nav-section">
    <div class="nav-label">MY SPACE</div>

    <button class="nav-btn active" data-page="dashboard">
      <span class="nav-icon">⌂</span>

    </button>

    <button class="nav-btn" data-page="all">

  <div class="nav-section">

    </button>

    <button class="nav-btn" data-page="avoid">

  <div class="nav-section">

  <div class="sidebar-footer">

</aside>

<div class="mobile-topbar">
  <button class="hamburger" id="hamburger" aria-label="Open menu">
    ☰
  </button>

  <div class="mobile-title">
    Lunelle
  </div>
</div>

<main class="main" id="main"></main>

</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<div class="toast" id="toast"></div>

function clone(x){
  return JSON.parse(JSON.stringify(x));
}


function loadData(){

  try{

    const saved =
      JSON.parse(
        localStorage.getItem(STORAGE_KEY)
      );

    if(!saved){
      return clone(DEFAULTS);
    }

    return {

      ...clone(DEFAULTS),

      ...saved,

      profile:{
        ...clone(DEFAULTS.profile),
        ...(saved.profile || {})
      },

      brands:
        Array.isArray(saved.brands)
        ? saved.brands
        : clone(DEFAULTS.brands),

      categories:
        Array.isArray(saved.categories)
        ? saved.categories
        : clone(DEFAULTS.categories),

      types:{
        ...clone(DEFAULTS.types),
        ...(saved.types || {})
      },

      avoidIngredients:
        Array.isArray(saved.avoidIngredients)
        ? saved.avoidIngredients
        : [],

      products:
        Array.isArray(saved.products)
        ? saved.products
        : []

    };

  }catch(e){

    return clone(DEFAULTS);

  }

}


function saveData(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );

}


function esc(v){

  return String(v ?? "")
    .replace(
      /[&<>"']/g,
      m => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[m])
    );

}


function uid(){

  return Date.now().toString(36)
    +
    Math.random()
      .toString(36)
      .slice(2,7);

}


function toast(msg){

  const el =
    document.getElementById("toast");

  el.textContent = msg;

  el.classList.add("show");

  setTimeout(
    () => el.classList.remove("show"),
    2200
  );

}


function normalize(v){

  return String(v || "")
    .trim()
    .toLowerCase();

}


function formatDate(v){

  if(!v){
    return "—";
  }

  const d =
    new Date(v + "T00:00:00");

  if(isNaN(d)){
    return "—";
  }

  return d.toLocaleDateString(
    "en-GB",
    {
      day:"2-digit",
      month:"short",
      year:"numeric"
    }
  );

}


function daysBetween(a,b){

  if(!a || !b){
    return null;
  }

  const x =
    new Date(a + "T00:00:00");

  const y =
    new Date(b + "T00:00:00");

  if(isNaN(x) || isNaN(y)){
    return null;
  }

  return Math.max(
    0,
    Math.floor(
      (y-x)/86400000
    )
  );

}


function formatDuration(days){

  if(
    days === null ||
    days === undefined
  ){
    return "—";
  }

  if(days < 30){

    return `${days} day${days===1?"":"s"}`;

  }

  const months =
    Math.floor(days / 30.4375);

  if(months < 12){

    return `${months} month${months===1?"":"s"}`;

  }

  const years =
    Math.floor(months / 12);

  const rem =
    months % 12;

  return `${years} year${years===1?"":"s"}${
    rem
      ? ` ${rem} month${rem===1?"":"s"}`
      : ""
  }`;

}


function productDuration(p){

  return p.openedOn && p.emptyOn
    ? formatDuration(
        daysBetween(
          p.openedOn,
          p.emptyOn
        )
      )
    : "—";

}


function isShadeEligible(p){

  const t =
    normalize(p.productType);

  return (
    SHADE_TYPES.some(
      x => normalize(x) === t
    )
    ||
    normalize(p.category) === "makeup"
  );

}


function resultBadge(result){

  const label = {
    yes:"♡ YES",
    maybe:"✦ MAYBE",
    no:"× NO"
  }[result] || "—";

  return `
    <span class="badge ${esc(result || "maybe")}">
      ${label}
    </span>
  `;

}


function statusBadge(status){

  const map = {
    not_open:"Not Open",
    opened:"Opened",
    finished:"Finished / Empty",
    decluttered:"Decluttered"

  return `
    <span class="badge ${

        ? "finished"
        : status==="decluttered"
          ? "decluttered"
          : "open"
    }">
      ${map[status] || "—"}
    </span>
  `;

}

========================= */

function renderAvoid(){

  const avoid =
    data.avoidIngredients;

  const matches = [];

  data.products.forEach(
    p => {

      const ing =
        String(p.ingredients || "")
          .split(/[,;\n]+/)
          .map(normalize)
          .filter(Boolean);

      avoid.forEach(
        a => {

          if(
            ing.includes(
              normalize(a)
            )
          ){

            matches.push({
              p,
              a
            });

          }

        }
      );

    }
  );

  return (

    header(
      "What Should I Avoid?",
      "Ingredients you've marked as avoid ingredients will trigger warnings when you enter them."
    )

    +

    `
    <div class="panel">

      <div class="panel-title">

      ${
        avoid.length

          ? `

                  .join("")

/* =========================
   INGREDIENTS
========================= */

function renderIngredients(){

  const counts = {};

  data.products.forEach(
    p => {

      String(p.ingredients || "")
        .split(/[,;\n]+/)
        .map(x => x.trim())
        .filter(Boolean)
        .forEach(
          x => {

            const key =
              x.toLowerCase();

            if(!counts[key]){

              counts[key] = {
                name:x,
                count:0
              };

            }

            counts[key].count++;

          }
        );

    }
  );

  const list =
    Object.values(counts)
      .sort(
        (a,b) =>
          b.count-a.count
      );

  return (

    header(
      "My Ingredients",
      "A simple inventory of ingredients appearing in your product diary."
    )

    +

    `
    <div class="panel">

      ${
        list.length

          ? `
            <div class="manage-list">

              ${
                list
                  .map(
                    x =>
                      `
                      <div class="manage-item">

                        <span>
                          ${esc(x.name)}
                        </span>

                        <span class="tag">
                          ${x.count}
                          product${x.count===1?"":"s"}
                        </span>

                      </div>
                      `
                  )
                  .join("")
              }

            </div>
          `

          : `
            <div
              class="empty-state"
              style="padding:25px"
            >
              Add ingredients to your products
              to build this list.
            </div>
          `
      }

    </div>
    `

  );

}

function bindPageEvents(){

  const form =
    document.getElementById(
      "productForm"
    );

  if(form){

    bindSearch(
      "brandInput",
      "brandSuggestions",
      () => data.brands
    );

    bindSearch(
      "categoryInput",
      "categorySuggestions",
      () => data.categories
    );

    bindSearch(
      "typeInput",
      "typeSuggestions",
      () => {

        const cat =
          document
            .getElementById(
              "categoryInput"
            )
            ?.value;

        return cat &&
          data.types[cat]

          ? data.types[cat]

          : Object.values(
              data.types
            ).flat();

      }
    );


    [
      "brandInput",
      "categoryInput",
      "typeInput"
    ]
    .forEach(
      id => {

        document
          .getElementById(id)
          ?.addEventListener(
            "input",
            () => {

              if(
                id === "categoryInput"
              ){

              }

            }
          );

      }
    );


    document
      .getElementById(
        "categoryInput"

      ?.addEventListener(
        "change",
        updateShadeSection
      );


    document
      .getElementById(
        "typeInput"
      )
      ?.addEventListener(
        "input",
        updateShadeSection
      );


    document
      .getElementById(
        "ingredients"
      )
      ?.addEventListener(
        "input",
        checkIngredientWarning
      );


    document
      .getElementById(
        "status"
      )
      ?.addEventListener(
        "change",
        updateEmptyFields
      );


    document
      .getElementById(
        "openedOn"
      )
      ?.addEventListener(
        "input",
        updateUsageSummary
      );


    document
      .getElementById(
        "emptyOn"
      )
      ?.addEventListener(
        "input",
        updateUsageSummary
      );


    form.addEventListener(
      "submit",
      handleProductSubmit

    checkIngredientWarning();

  }


  /* SETTINGS TABS */

  document
    .querySelectorAll(
      ".settings-tab"

    .forEach(

        tab.addEventListener(

            document

            tab.classList.add(

            document
              .getElementById(
                "tab-" + tab.dataset.tab

                "active"

          }

    );


  /* PERSONAL FORM */

  const pf =
    document.getElementById(
      "personalForm"

  if(pf){

    pf.addEventListener(
      "submit",
      savePersonal

  }

  document
    .getElementById(
      "languageSetting"

    ?.addEventListener(
      "change",
      e => {

        data.language =

            : "Language saved."
        );

      }
    );

/* =========================
   SEARCHABLE INPUT
========================= */

function bindSearch(
  inputId,
  boxId,
  getItems
){

  const input =
    document.getElementById(
      inputId
    );

  const box =
    document.getElementById(
      boxId
    );

  if(!input || !box){
    return;
  }


  function show(){

    const q =
      normalize(input.value);

    const unique =
      [
        ...new Set(
          getItems()
            .filter(Boolean)
        )
      ];


    const filtered =
      unique
        .filter(
          x =>
            !q ||
            normalize(x)
              .includes(q)
        )
        .sort(
          (a,b) => {

            if(!q){
              return a.localeCompare(b);
            }

            const aa =
              normalize(a);

            const bb =
              normalize(b);

            return (
              (aa.startsWith(q) ? 0 : 1)
              -
              (bb.startsWith(q) ? 0 : 1)
            )
            ||
            aa.localeCompare(bb);

          }
        )
        .slice(0,10);


    box.innerHTML =

      filtered
        .map(
          x =>
            `
            <div
              class="suggest-item"
              data-value="${esc(x)}"
            >
              ${esc(x)}
            </div>
            `
        )
        .join("")

      +

      (
        q &&
        !unique.some(
          x =>
            normalize(x) === q
        )

          ? `
            <div
              class="suggest-item"
              data-value="${esc(input.value.trim())}"
            >
              ＋ Use
              “${esc(input.value.trim())}”
            </div>
            `

          : ""
      );


    box.classList.toggle(
      "show",
      filtered.length > 0 || !!q
    );


    box
      .querySelectorAll(
        ".suggest-item"
      )
      .forEach(
        item => {

          item.addEventListener(
            "mousedown",
            e => {

              e.preventDefault();

              input.value =
                item.dataset.value;

              box.classList.remove(
                "show"
              );


              if(
                inputId === "categoryInput"
              ){

                updateShadeSection();

              }


              if(
                inputId === "typeInput"
              ){

                updateShadeSection();

              }

            }
          );

        }
      );

  }


  input.addEventListener(
    "focus",
    show
  );

  input.addEventListener(
    "input",
    show
  );


  document.addEventListener(
    "click",
    e => {

      if(
        !input.parentElement.contains(
          e.target
        )
      ){

        box.classList.remove(
          "show"
        );

      }

    }
  );

}

function updateShadeSection(){

  const cat =
    normalize(
      document
        .getElementById(
          "categoryInput"

  const type =
    normalize(

        .getElementById(

  const show =
    cat === "makeup"
    ||
    SHADE_TYPES.some(
      x =>
        normalize(x) === type
    );


  document
    .getElementById(
      "shadeMatchSection"
    )
    ?.classList.toggle(
      "show",
      show
    );

}


/* =========================
   INGREDIENT WARNING
========================= */

function checkIngredientWarning(){

  const box =
    document.getElementById(
      "ingredientWarning"
    );

  if(!box){
    return;
  }


  const entered =
    String(
      document.getElementById(
        "ingredients"
      ).value || ""
    )
    .split(/[,;\n]+/)
    .map(normalize)
    .filter(Boolean);


  const matches =
    data.avoidIngredients
      .filter(
        a =>
          entered.includes(
            normalize(a)
          )
      );


  if(matches.length){

    box.style.display =
      "block";

    box.innerHTML =
      "⚠ Avoid ingredient found: " +
      "<strong>" +
      matches
        .map(esc)
        .join(", ") +
      "</strong>";

  }else{

    box.style.display =
      "none";

  }

}

function updateEmptyFields(){

    const s =
      document.getElementById(
        "usageSummary"
      );

    if(s){
      s.classList.remove(
        "show"
      );
    }


    const b =
      document.getElementById(
        "buyAgainWrap"
      );

    if(b){
      b.classList.remove(
        "show"
      );
    }

  }else{

    updateUsageSummary();

  }

}


function updateUsageSummary(){

  const status =
    document.getElementById(
      "status"
    )?.value;

  const opened =
    document.getElementById(
      "openedOn"
    )?.value;

  const empty =
    document.getElementById(
      "emptyOn"
    )?.value;


  const summary =
    document.getElementById(
      "usageSummary"
    );

  const buy =
    document.getElementById(
      "buyAgainWrap"
    );


  if(!summary || !buy){
    return;
  }


  if(
    status === "finished"
    &&
    empty
  ){

    const d =
      daysBetween(
        opened,
        empty
      );


    summary.classList.add(
      "show"
    );


    summary.innerHTML =
      d === null

        ? `
          Usage duration:
          <strong>
            Please add Opened On to calculate.
          </strong>
        `

        : `
          Usage duration:
          <strong>
            ${formatDuration(d)}
          </strong>
        `;


    buy.classList.add(
      "show"
    );

  }else{

    summary.classList.remove(
      "show"
    );

    buy.classList.remove(
      "show"
    );

  }

}


function getRadio(name){

  return document
    .querySelector(
      `input[name="${name}"]:checked`
    )
    ?.value || "";

}


/* =========================
   SAVE PRODUCT
========================= */

function handleProductSubmit(e){

  e.preventDefault();


  const name =
    document
      .getElementById(
        "productName"
      )
      .value
      .trim();


  const category =
    document
      .getElementById(
        "categoryInput"
      )
      .value
      .trim();


  const type =
    document
      .getElementById(
        "typeInput"
      )
      .value
      .trim();


  const brand =
    document
      .getElementById(
        "brandInput"
      )
      .value
      .trim();


  const status =
    document
      .getElementById(
        "status"
      )
      .value;


  const openedOn =
    document
      .getElementById(
        "openedOn"
      )
      .value;


  const emptyOn =
    document
      .getElementById(
        "emptyOn"
      )
      ?.value || "";


  const buyAgain =
    getRadio("buyAgain");


  if(!name || !category){

    toast(
      "Please complete Product Name and Category."
    );

    return;

  }


  if(status === "finished"){

    if(!emptyOn){

      toast(
        "Finished / Empty products need an Empty On date."
      );

      return;

    }


    if(
      openedOn &&
      daysBetween(
        openedOn,
        emptyOn
      ) === null
    ){

      toast(
        "Please check the dates."
      );

      return;

    }


    if(
      openedOn &&
      new Date(emptyOn) <
      new Date(openedOn)
    ){

      toast(
        "Empty On cannot be before Opened On."
      );

      return;

    }


    if(!buyAgain){

      toast(
        "Please choose Would You Buy It Again?"
      );

      return;

    }

  }


  /* AUTO-SAVE CATEGORY */

  if(
    !data.categories.some(
      x =>
        normalize(x) ===
        normalize(category)
    )
  ){

    data.categories.push(
      category
    );

  }


  /* AUTO-SAVE BRAND */

  if(
    brand &&
    !data.brands.some(
      x =>
        normalize(x) ===
        normalize(brand)
    )
  ){

    data.brands.push(
      brand
    );

  }


  /* AUTO-SAVE TYPE UNDER CATEGORY */

  if(type){

    if(
      !data.types[category]
    ){

      data.types[category] = [];

    }


    if(
      !data.types[category].some(
        x =>
          normalize(x) ===
          normalize(type)
      )
    ){

      data.types[category].push(
        type
      );

    }

  }


  const obj = {

    id:
      editingId || uid(),

    name,

    brand,

    category,

    productType:type,

    ingredients:
      document
        .getElementById(
          "ingredients"
        )
        .value
        .trim(),

    shade:
      document
        .getElementById(
          "shadeInput"
        )
        .value
        .trim(),

    shadeMatch:
      getRadio("shadeMatch"),

    openedOn,

    status,

    emptyOn,

    buyAgain:
      status === "finished"
        ? buyAgain
        : "",

    result:
      getRadio("result")
      ||
      "yes",

    notes:
      document
        .getElementById(
          "notes"
        )
        .value
        .trim(),

    updatedAt:
      new Date().toISOString()

  };


  const idx =
    data.products.findIndex(
      x =>
        x.id === obj.id
    );


  if(idx >= 0){

    data.products[idx] =
      obj;

  }else{

    data.products.push(
      obj
    );

  }


  saveData();

  toast(
    editingId
      ? "Product updated ♡"
      : "Product saved ♡"
  );


  editingId = null;

  currentPage = "all";

  render();

}

      )}

function detail(k,v){

  return `
    <div class="detail">

      <small>
        ${esc(k)}
      </small>

      <strong>
        ${esc(v)}
      </strong>

    </div>
  `;

}


function closeModal(){

  document
    .getElementById(
      "modalOverlay"
    )
    .classList.remove(
      "show"
    );

  currentProductId =
    null;

}


function editProduct(id){

  closeModal();

  editingId =
    id;

  currentPage =
    "add";

  render();

}


function deleteProduct(id){

  const p =
    data.products.find(
      x =>
        x.id === id
    );


  if(!p){
    return;
  }


  if(
    !confirm(
      `Delete "${p.name}"? This cannot be undone.`
    )
  ){

    return;

  }


  data.products =
    data.products.filter(
      x =>
        x.id !== id
    );


  saveData();

  toast(
    "Product deleted."
  );


  editingId =
    null;

  currentPage =
    "all";

  render();

}


/* =========================
   RESET
========================= */

function resetApp(){

  const answer =
    prompt(
      "Type RESET to delete all Lunelle data from this browser."
    );


  if(answer === "RESET"){

    localStorage.removeItem(
      STORAGE_KEY
    );

    data =
      clone(DEFAULTS);

    editingId =
      null;

    currentPage =
      "dashboard";

    render();

    toast(
      "Lunelle has been reset."
    );

  }

}
