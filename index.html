<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Lunelle — My Beauty Diary</title>

<style>

/* =====================================================
   ROOT
===================================================== */

:root{

  --pink:#f6b8d2;
  --pink2:#fde5ef;

  --purple:#b9a4ed;
  --purple2:#eee8ff;

  --blue:#a9d8f5;
  --blue2:#e7f5ff;

  --text:#675875;
  --muted:#9a8fa2;

  --white:#fffafd;

  --border:#eadde9;

  --yes:#8dbfa8;
  --maybe:#a99adf;
  --no:#d79aaa;

  --warning:#e5ad78;

  --shadow:
    0 15px 45px
    rgba(150,110,150,.10);
}


/* =====================================================
   RESET
===================================================== */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{

  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  color:var(--text);

  background:

    radial-gradient(
      circle at 10% 10%,
      rgba(246,184,210,.25),
      transparent 28%
    ),

    radial-gradient(
      circle at 90% 20%,
      rgba(169,216,245,.22),
      transparent 30%
    ),

    linear-gradient(
      135deg,
      #fffaff,
      #fdf8ff 45%,
      #f8fbff
    );
}


/* =====================================================
   MOBILE MENU BUTTON
===================================================== */

.mobile-menu-btn{

  display:none;

  position:fixed;

  top:15px;
  left:15px;

  z-index:250;

  width:43px;
  height:43px;

  border:1px solid var(--border);

  border-radius:14px;

  background:
    rgba(255,255,255,.92);

  color:#8b7094;

  font-size:20px;

  cursor:pointer;

  box-shadow:
    0 8px 25px
    rgba(130,100,140,.12);

  backdrop-filter:blur(15px);
}


/* =====================================================
   SIDEBAR OVERLAY
===================================================== */

.sidebar-overlay{

  display:none;

  position:fixed;

  inset:0;

  z-index:190;

  background:
    rgba(70,50,75,.20);

  backdrop-filter:blur(3px);
}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{

  position:fixed;

  left:0;
  top:0;
  bottom:0;

  width:260px;
  height:100vh;

  padding:
    25px
    16px
    18px;

  overflow-y:auto;
  overflow-x:hidden;

  background:
    rgba(255,255,255,.86);

  backdrop-filter:blur(25px);

  border-right:
    1px solid var(--border);

  z-index:200;

  display:flex;

  flex-direction:column;

  transition:
    transform .28s ease;
}


.sidebar::-webkit-scrollbar{
  width:5px;
}

.sidebar::-webkit-scrollbar-track{
  background:transparent;
}

.sidebar::-webkit-scrollbar-thumb{

  background:#ead7e5;

  border-radius:20px;
}


/* mobile close */

.sidebar-close{

  display:none;

  position:absolute;

  right:15px;
  top:15px;

  width:33px;
  height:33px;

  border:0;

  border-radius:50%;

  background:#f8edf7;

  color:#8d788f;

  font-size:18px;

  cursor:pointer;
}


/* =====================================================
   LOGO
===================================================== */

.logo{

  padding:
    5px
    12px
    24px;
}

.logo-name{

  font-family:Georgia,serif;

  font-size:31px;

  color:#80678d;

  letter-spacing:-1px;
}

.logo-sub{

  margin-top:3px;

  font-size:9px;

  letter-spacing:2px;

  text-transform:uppercase;

  color:#b6a6b9;
}


/* =====================================================
   NAVIGATION
===================================================== */

.nav-section{

  margin-bottom:18px;
}

.nav-label{

  padding:
    0
    13px
    7px;

  font-size:9px;

  font-weight:800;

  letter-spacing:1.5px;

  text-transform:uppercase;

  color:#b5a6b7;
}

.nav-item{

  width:100%;

  border:0;

  background:transparent;

  padding:
    10px
    12px;

  margin:2px 0;

  border-radius:13px;

  color:#76657e;

  text-align:left;

  font-size:12px;

  font-weight:600;

  cursor:pointer;

  transition:.2s;

  display:flex;

  align-items:center;

  gap:10px;
}

.nav-item:hover{

  background:#fff1f7;

  color:#b76f93;
}

.nav-item.active{

  background:

    linear-gradient(
      135deg,
      #ffe7f1,
      #eee8ff
    );

  color:#a66f91;

  box-shadow:
    0 5px 18px
    rgba(190,150,190,.10);
}

.nav-icon{

  width:21px;

  text-align:center;

  font-size:14px;
}

.sidebar-spacer{

  flex:1;

  min-height:15px;
}


/* =====================================================
   FOOTER
===================================================== */

.footer{

  padding:
    18px
    10px
    5px;

  text-align:center;

  font-size:9px;

  letter-spacing:1px;

  color:#b9adb9;
}


/* =====================================================
   MAIN
===================================================== */

.main{

  margin-left:260px;

  min-height:100vh;

  padding:
    42px
    48px
    55px;
}

.container{

  max-width:1120px;

  margin:auto;
}


/* =====================================================
   PAGE HEADER
===================================================== */

.page-header{

  margin-bottom:27px;
}

.page-title{

  font-family:Georgia,serif;

  font-size:38px;

  color:#715b78;

  letter-spacing:-1px;
}

.page-description{

  margin-top:7px;

  color:#a195a7;

  font-size:12px;

  line-height:1.6;
}


/* =====================================================
   CARDS
===================================================== */

.card{

  background:
    rgba(255,255,255,.80);

  border:
    1px solid var(--border);

  border-radius:23px;

  padding:24px;

  box-shadow:var(--shadow);

  margin-bottom:18px;
}

.card-title{

  font-size:15px;

  font-weight:800;

  color:#75627d;
}

.card-description{

  margin-top:5px;

  color:#a399a8;

  font-size:11px;

  line-height:1.6;
}


/* =====================================================
   DASHBOARD
===================================================== */

.welcome{

  padding:29px;

  border-radius:28px;

  background:

    linear-gradient(
      135deg,
      rgba(255,224,237,.88),
      rgba(232,225,255,.88),
      rgba(225,244,255,.82)
    );

  border:
    1px solid #eee0ed;

  box-shadow:var(--shadow);

  margin-bottom:20px;
}

.welcome-small{

  font-size:11px;

  color:#9b8199;
}

.welcome-name{

  margin-top:5px;

  font-family:Georgia,serif;

  font-size:31px;

  color:#725b7b;
}

.stats{

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:13px;
}

.stat{

  padding:20px;

  border-radius:19px;

  background:#fffafd;

  border:
    1px solid var(--border);
}

.stat-number{

  font-family:Georgia,serif;

  font-size:28px;

  color:#8b7094;
}

.stat-label{

  margin-top:3px;

  font-size:10px;

  color:#a399a7;
}


/* =====================================================
   BUTTONS
===================================================== */

.btn{

  border:0;

  padding:
    11px
    17px;

  border-radius:13px;

  font-size:11px;

  font-weight:800;

  cursor:pointer;

  transition:.2s;
}

.btn:hover{

  transform:
    translateY(-1px);
}

.btn-primary{

  color:white;

  background:

    linear-gradient(
      135deg,
      #e8a8c5,
      #a99adf
    );

  box-shadow:
    0 7px 20px
    rgba(190,150,190,.20);
}

.btn-soft{

  background:#f7eef7;

  color:#8d718e;
}

.btn-blue{

  background:#e8f6ff;

  color:#7099b2;
}

.btn-danger{

  background:#fff0f3;

  color:#bd7188;
}


/* =====================================================
   FORMS
===================================================== */

.form-grid{

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:17px;
}

.form-group{

  margin-bottom:16px;
}

.form-label{

  display:block;

  margin-bottom:7px;

  font-size:11px;

  font-weight:800;

  color:#79687e;
}

.optional{

  color:#b3a7b4;

  font-weight:500;
}

.form-input,
.form-select,
.form-textarea{

  width:100%;

  border:
    1px solid #eadde9;

  outline:none;

  background:#fffafd;

  color:#6d6072;

  border-radius:16px;

  padding:
    13px
    15px;

  font-family:inherit;

  font-size:12px;

  transition:.2s;
}

.form-input:focus,
.form-select:focus,
.form-textarea:focus{

  border-color:#e5a8c4;

  box-shadow:
    0 0 0 4px
    rgba(246,184,210,.12);
}

.form-textarea{

  min-height:105px;

  resize:vertical;
}

.full{

  grid-column:
    1 / -1;
}

.inline{

  display:flex;

  gap:8px;

  align-items:stretch;
}

.inline .form-input,
.inline .form-select{

  flex:1;
}


/* =====================================================
   DATE INPUT
===================================================== */

input[type="date"]{

  min-height:48px;

  color:#75647b;
}

input[type="date"]::-webkit-calendar-picker-indicator{

  cursor:pointer;

  opacity:.75;
}


/* =====================================================
   EMPTY DATE AREA
===================================================== */

.empty-date-box{

  padding:
    13px
    15px;

  border-radius:16px;

  background:

    linear-gradient(
      135deg,
      #fff0f5,
      #f0ecff
    );

  border:
    1px solid #eedce9;

  font-size:10px;

  color:#987e96;

  line-height:1.6;
}


/* =====================================================
   RESULT BUTTONS
===================================================== */

.result-buttons{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:10px;
}

.result-btn{

  border:0;

  border-radius:16px;

  padding:15px;

  background:#f9f4f8;

  color:#9b899c;

  font-size:13px;

  font-weight:800;

  cursor:pointer;

  transition:.2s;
}

.result-btn:hover{

  transform:
    translateY(-1px);
}

.result-btn.selected.yes{

  background:#e7f5ed;

  color:#65967c;
}

.result-btn.selected.maybe{

  background:#eee9ff;

  color:#8874bd;
}

.result-btn.selected.no{

  background:#fff0f3;

  color:#b8798b;
}


/* =====================================================
   CHIPS
===================================================== */

.chips{

  display:flex;

  flex-wrap:wrap;

  gap:8px;
}

.chip{

  border:
    1px solid #eadde9;

  background:#fffafd;

  color:#8b7b8e;

  border-radius:30px;

  padding:
    8px
    13px;

  font-size:10px;

  font-weight:700;

  cursor:pointer;
}

.chip:hover{

  border-color:#dfc9dd;
}

.chip.selected{

  background:

    linear-gradient(
      135deg,
      #ffe2ed,
      #ebe4ff
    );

  border-color:#e5cbe1;

  color:#9b7193;
}


/* =====================================================
   WARNING
===================================================== */

.warning-box{

  display:none;

  margin-bottom:18px;

  padding:
    16px
    18px;

  border-radius:17px;

  background:

    linear-gradient(
      135deg,
      #fff4e9,
      #fff1f5
    );

  border:
    1px solid #f0d7c6;

  color:#966f58;
}

.warning-box.show{

  display:block;
}

.warning-title{

  font-size:12px;

  font-weight:900;
}

.warning-text{

  margin-top:5px;

  font-size:10px;

  line-height:1.6;
}


/* =====================================================
   PRODUCT GRID
===================================================== */

.product-grid{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:14px;
}

.product-card{

  position:relative;

  padding:18px;

  border-radius:19px;

  background:#fffafd;

  border:
    1px solid var(--border);

  cursor:pointer;

  transition:.2s;
}

.product-card:hover{

  transform:
    translateY(-2px);

  box-shadow:
    0 12px 25px
    rgba(150,110,150,.09);
}

.product-status{

  display:inline-block;

  padding:
    5px
    8px;

  border-radius:20px;

  background:#f6eef7;

  color:#9b819d;

  font-size:8px;

  font-weight:800;

  text-transform:uppercase;

  letter-spacing:.5px;
}

.product-name{

  margin-top:10px;

  font-size:13px;

  font-weight:800;

  color:#6e5d75;
}

.product-brand{

  margin-top:3px;

  font-size:10px;

  color:#aaa0aa;
}

.product-meta{

  margin-top:10px;

  display:flex;

  flex-wrap:wrap;

  gap:5px;
}

.meta-chip{

  padding:
    5px
    8px;

  border-radius:15px;

  background:#f8f2f8;

  color:#97879a;

  font-size:8px;
}

.product-result{

  position:absolute;

  right:15px;
  top:15px;

  font-size:15px;
}

.empty-mini{

  margin-top:8px;

  font-size:9px;

  color:#ad8996;
}


/* =====================================================
   EMPTY DURATION
===================================================== */

.duration-badge{

  display:inline-block;

  margin-top:8px;

  padding:
    6px
    9px;

  border-radius:12px;

  background:#eef8ff;

  color:#789caf;

  font-size:8px;

  font-weight:800;
}


/* =====================================================
   EMPTY STATE
===================================================== */

.empty{

  text-align:center;

  padding:50px 20px;

  color:#aaa0ad;
}

.empty-icon{

  font-size:30px;

  margin-bottom:8px;
}

.empty-title{

  font-size:13px;

  font-weight:800;
}

.empty-text{

  margin-top:5px;

  font-size:10px;
}


/* =====================================================
   PROFILE
===================================================== */

.profile-info-grid{

  margin-top:20px;

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:12px;
}

.profile-info{

  padding:14px;

  border-radius:15px;

  background:#fcf7fc;

  border:
    1px solid #f0e5ef;
}

.profile-info-label{

  font-size:9px;

  color:#a69aa8;

  text-transform:uppercase;

  letter-spacing:.6px;
}

.profile-info-value{

  margin-top:5px;

  font-size:12px;

  color:#75647b;

  font-weight:700;
}

.shade-match-card{

  display:flex;

  align-items:center;

  gap:13px;

  padding:13px;

  margin-top:10px;

  border-radius:15px;

  background:#fffafd;

  border:
    1px solid var(--border);

  transition:.2s;
}

.shade-match-card:hover{

  transform:
    translateY(-1px);

  box-shadow:
    0 8px 20px
    rgba(150,110,150,.08);
}

.shade-circle{

  width:38px;
  height:38px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:

    linear-gradient(
      135deg,
      #ffe0eb,
      #e8e2ff
    );
}

.shade-info{

  flex:1;
}

.shade-name{

  font-size:11px;

  font-weight:800;
}

.shade-brand{

  margin-top:2px;

  font-size:9px;

  color:#a49aa7;
}

.shade-type{

  margin-top:3px;

  font-size:8px;

  color:#b3a9b4;
}

.read-only-note{

  font-size:8px;

  font-weight:800;

  color:#9c82a1;
}


/* =====================================================
   SETTINGS TABS
===================================================== */

.settings-tabs{

  display:flex;

  gap:5px;

  overflow-x:auto;

  padding:5px;

  margin-bottom:18px;

  border-radius:17px;

  background:#f8f0f7;

  border:
    1px solid #eee2ec;
}

.settings-tabs::-webkit-scrollbar{

  height:4px;
}

.settings-tabs::-webkit-scrollbar-thumb{

  background:#e6d4e2;

  border-radius:20px;
}

.settings-tab{

  border:0;

  background:transparent;

  color:#998c9e;

  padding:
    10px
    17px;

  border-radius:12px;

  font-size:10px;

  font-weight:800;

  cursor:pointer;

  white-space:nowrap;
}

.settings-tab.active{

  background:white;

  color:#9d7193;

  box-shadow:
    0 4px 13px
    rgba(150,110,150,.08);
}

.library-row{

  display:flex;

  align-items:center;

  gap:9px;

  margin-bottom:8px;

  padding:
    10px
    12px;

  border-radius:12px;

  background:#fcf8fc;

  border:
    1px solid #f0e6ef;
}

.library-row span{

  flex:1;

  font-size:11px;

  color:#78677c;
}

.delete-small{

  border:0;

  background:#fff0f3;

  color:#b77889;

  width:25px;
  height:25px;

  border-radius:50%;

  cursor:pointer;
}


/* =====================================================
   MODAL
===================================================== */

.modal-backdrop{

  position:fixed;

  inset:0;

  z-index:500;

  display:none;

  align-items:center;

  justify-content:center;

  padding:20px;

  background:
    rgba(74,55,78,.20);

  backdrop-filter:blur(7px);
}

.modal-backdrop.show{

  display:flex;
}

.modal{

  width:
    min(620px,100%);

  max-height:90vh;

  overflow-y:auto;

  padding:27px;

  border-radius:25px;

  background:#fffafd;

  border:
    1px solid var(--border);

  box-shadow:
    0 30px 80px
    rgba(80,50,90,.20);
}

.modal-header{

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:20px;
}

.modal-title{

  font-family:Georgia,serif;

  font-size:25px;

  color:#725d78;
}

.close{

  border:0;

  background:#f7eef7;

  color:#8d788f;

  width:33px;
  height:33px;

  border-radius:50%;

  cursor:pointer;
}

.modal-actions{

  display:flex;

  justify-content:flex-end;

  gap:8px;

  margin-top:20px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:900px){

  .sidebar{

    width:235px;
  }

  .main{

    margin-left:235px;

    padding:
      30px
      25px;
  }

  .product-grid{

    grid-template-columns:
      repeat(2,1fr);
  }

  .stats{

    grid-template-columns:
      repeat(2,1fr);
  }

  .profile-info-grid{

    grid-template-columns:
      repeat(2,1fr);
  }

}


/* =====================================================
   PHONE
===================================================== */

@media(max-width:680px){

  body{

    overflow-x:hidden;
  }


  /* hamburger */

  .mobile-menu-btn{

    display:flex;

    align-items:center;

    justify-content:center;
  }


  /* overlay */

  .sidebar-overlay{

    display:block;

    opacity:0;

    pointer-events:none;

    transition:
      opacity .28s ease;
  }

  .sidebar-overlay.show{

    opacity:1;

    pointer-events:auto;
  }


  /* sidebar */

  .sidebar{

    width:285px;

    max-width:
      85vw;

    height:100vh;

    transform:
      translateX(-105%);

    box-shadow:
      15px 0 45px
      rgba(70,45,80,.14);
  }

  .sidebar.open{

    transform:
      translateX(0);
  }

  .sidebar-close{

    display:block;
  }


  /* main */

  .main{

    margin-left:0;

    padding:
      75px
      16px
      35px;
  }


  .page-title{

    font-size:30px;
  }


  .form-grid{

    grid-template-columns:1fr;
  }

  .full{

    grid-column:auto;
  }


  .product-grid{

    grid-template-columns:1fr;
  }


  .stats{

    grid-template-columns:
      repeat(2,1fr);
  }


  .profile-info-grid{

    grid-template-columns:1fr;
  }


  .result-buttons{

    grid-template-columns:1fr;
  }


  .welcome{

    padding:23px;
  }


  .welcome-name{

    font-size:26px;
  }


  .card{

    padding:19px;

    border-radius:19px;
  }


  .inline{

    flex-direction:column;
  }


  .inline .btn{

    width:100%;
  }


  .settings-tabs{

    padding:4px;
  }


  .settings-tab{

    padding:
      9px
      13px;
  }

}


/* =====================================================
   EXTRA SMALL PHONE
===================================================== */

@media(max-width:380px){

  .sidebar{

    width:270px;
  }

  .stats{

    grid-template-columns:1fr;
  }

  .page-title{

    font-size:27px;
  }

}

</style>
</head>


<body>


<!-- =====================================================
     MOBILE MENU BUTTON
===================================================== -->

<button
  class="mobile-menu-btn"
  id="mobileMenuBtn"
  onclick="openSidebar()"
  aria-label="Open menu"
>
  ☰
</button>


<!-- =====================================================
     SIDEBAR OVERLAY
===================================================== -->

<div
  class="sidebar-overlay"
  id="sidebarOverlay"
  onclick="closeSidebar()"
></div>


<!-- =====================================================
     SIDEBAR
===================================================== -->

<aside
  class="sidebar"
  id="sidebar"
>


  <!-- CLOSE BUTTON FOR MOBILE -->

  <button
    class="sidebar-close"
    onclick="closeSidebar()"

/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHTML(value){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   INGREDIENT HELPERS
===================================================== */

function normalizeIngredient(
  value
){

  return String(
    value || ""
  )
  .trim()
  .toLowerCase();

}


function parseIngredients(
  text
){

  return String(
    text || ""
  )

  .split(
    /[,;\n]+/
  )

  .map(
    x =>
      x.trim()
  )

  .filter(
    Boolean
  );

}


function ingredientMatches(
  ingredients
){

  const avoided =
    data.avoidIngredients ||
    [];


  return ingredients.filter(
    ingredient =>

      avoided.some(
        bad =>

          normalizeIngredient(
            ingredient
          )
          ===
          normalizeIngredient(
            bad
          )
      )

  );

}

/* =====================================================
   DATE HELPERS
===================================================== */

function parseLocalDate(
  value
){

  if(!value)
    return null;


  const parts =
    value.split("-");


  if(
    parts.length !== 3
  )
    return null;


  const year =
    Number(parts[0]);

  const month =
    Number(parts[1]);

  const day =
    Number(parts[2]);


  return new Date(
    year,
    month - 1,
    day
  );

}


function formatDate(
  value
){

  if(!value)
    return "—";


  const date =
    parseLocalDate(
      value
    );


  if(!date)
    return value;


  return date.toLocaleDateString(
    undefined,
    {
      day:"2-digit",
      month:"short",
      year:"numeric"
    }
  );

}


function daysBetween(
  start,
  end
){

  const startDate =
    parseLocalDate(
      start
    );


  const endDate =
    parseLocalDate(
      end
    );


  if(
    !startDate ||
    !endDate
  )
    return null;


  const diff =
    endDate.getTime()
    -
    startDate.getTime();


  const days =
    Math.round(
      diff /
      (
        1000 *
        60 *
        60 *
        24
      )
    );


  return Math.max(
    0,
    days
  );

}


function durationLabel(
  start,
  end
){

  const days =
    daysBetween(
      start,
      end
    );


  if(
    days === null
  )
    return "";


  if(
    days === 0
  )
    return "Used for less than 1 day";


  if(
    days === 1
  )
    return "Used for 1 day";


  if(
    days < 30
  )
    return `Used for ${days} days`;


  const months =
    Math.floor(
      days / 30
    );


  const remainingDays =
    days % 30;


  if(
    months < 12
  ){

    if(
      remainingDays === 0
    ){

      return `Used for ${months} month${months === 1 ? "" : "s"}`;

    }


    return `Used for ${months} month${months === 1 ? "" : "s"} ${remainingDays} day${remainingDays === 1 ? "" : "s"}`;

  }


  const years =
    Math.floor(
      months / 12
    );


  const remainingMonths =
    months % 12;


  if(
    remainingMonths === 0
  ){

    return `Used for ${years} year${years === 1 ? "" : "s"}`;

  }


  return `Used for ${years} year${years === 1 ? "" : "s"} ${remainingMonths} month${remainingMonths === 1 ? "" : "s"}`;

}

function updateTypeOptions(
  selected=""
){

  const category =
    document.getElementById(
      "categorySelect"
    )?.value;


  const select =
    document.getElementById(
      "typeSelect"
    );


  if(
    !select ||
    !category
  )
    return;


  const types =
    data.types[
      category
    ] || [];


  select.innerHTML = `

    <option value="">
      Select type
    </option>


    ${
      types
        .map(
          type => `

            <option
              value="${escapeHTML(type)}"
              ${
                selected ===
                type
                ? "selected"
                : ""
              }
            >

              ${escapeHTML(
                type
              )}

            </option>

          `
        )
        .join("")
    }

  updateShadeSection();

}

  const type =
    document.getElementById(
      "typeSelect"

  if(

      type

  ){

    section.innerHTML =
      "";

  const current =
    selected ||

    document.getElementById(
      "shadeMatchInput"

  section.innerHTML = `

    <label class="form-label">
      Shade Match Me

        type="button"

function selectShade(
  value
){

  const input =
    document.getElementById(
      "shadeMatchInput"

    input.value =
      value;

/* =====================================================
   RESULT SELECT
===================================================== */

function selectResult(
  result
){

  document
    .querySelectorAll(
      ".result-btn"
    )
    .forEach(
      btn => {

        btn.classList.remove(
          "selected",
          "yes",
          "maybe",
          "no"
        );

      }
    );


  const id =
    "result" +
    result
      .charAt(0)
      .toUpperCase() +
    result.slice(1);


  const button =
    document.getElementById(
      id
    );


  if(button){

    button.classList.add(
      "selected",
      result
    );

  }


  const input =
    document.getElementById(
      "resultInput"
    );


  if(input){

    input.value =
      result;

  }

}

/* =====================================================
   INGREDIENT WARNING
===================================================== */

function checkIngredientWarning(){

  const warning =
    document.getElementById(
      "ingredientWarning"
    );


  const input =
    document.getElementById(
      "ingredientsInput"
    );


  if(
    !warning ||
    !input
  )
    return;


  const ingredients =
    parseIngredients(
      input.value
    );


  const matches =
    ingredientMatches(
      ingredients
    );


  if(
    !matches.length
  ){

    warning.classList.remove(
      "show"
    );

    warning.innerHTML =
      "";

    return;

  }


  warning.classList.add(
    "show"
  );


  warning.innerHTML = `

    <div class="warning-title">

      ⚠ You may want to check this one

    </div>


    <div class="warning-text">

      This product contains

      <strong>

        ${
          matches
            .map(
              escapeHTML
            )
            .join(", ")
        }

      </strong>

      — an ingredient you've marked
      as something to avoid.

      <br><br>

      This is a personal reminder
      based on your own list,
      not a medical judgement.

    </div>

  `;

}


/* =====================================================
   SAVE PRODUCT
===================================================== */

function saveProduct(){

  const name =
    document.getElementById(
      "productName"
    )
    .value
    .trim();


  if(!name){

    alert(
      "Please add a product name ♡"
    );

    return;

  }


  const category =
    document.getElementById(
      "categorySelect"
    )
    .value;


  const type =
    document.getElementById(
      "typeSelect"
    )
    .value;


  const status =
    document.getElementById(
      "statusSelect"
    )
    .value;


  const emptyDate =
    status ===
    "finished"

    ? (
        document.getElementById(
          "emptyDateInput"
        )?.value || ""
      )

    : "";


  if(
    status ===
    "finished" &&
    !emptyDate
  ){

    alert(
      "Please add the date you finished this product ♧"
    );

    return;

  }


  const openedDate =
    document.getElementById(
      "openedDate"
    ).value;


  if(
    status ===
    "finished" &&
    openedDate &&
    emptyDate
  ){

    const opened =
      parseLocalDate(
        openedDate
      );


    const empty =
      parseLocalDate(
        emptyDate
      );


    if(
      empty <
      opened
    ){

      alert(
        "Empty On cannot be earlier than Opened On ♡"
      );

      return;

    }

  }


  const product = {

    id:
      editingProductId ||
      Date.now(),


    name:


      name,


    brand:

      document.getElementById(
        "brandInput"
      )
      .value
      .trim(),


    category,


    type,


    ingredients:

      document.getElementById(
        "ingredientsInput"
      )
      .value
      .trim(),


    result:

      document.getElementById(
        "resultInput"
      )
      .value,


    status,


    openedDate,


    emptyDate,


    shadeMatch:

      document.getElementById(
        "shadeMatchInput"
      )?.value ||
      "",


    notes:

      document.getElementById(
        "notesInput"
      )
      .value
      .trim(),


    updatedAt:

      new Date()
        .toISOString()

  };


  const existingIndex =
    data.products.findIndex(
      p =>
        p.id ===
        product.id
    );


  if(
    existingIndex >= 0
  ){

    data.products[
      existingIndex
    ] =
      product;

  }else{

    data.products.push(
      product
    );

  }


  saveData();


  editingProductId =
    null;


  alert(
    "Saved ♡"
  );


  navigate(
    "all",
    document.querySelector(
      '[data-page="all"]'
    )
  );

}


/* =====================================================
   QUICK ADD BRAND
===================================================== */

function quickAddBrand(){

  const brand =
    prompt(
      "Add a new brand ♡"
    );


  if(!brand)
    return;


  const clean =
    brand.trim();


  if(!clean)
    return;


  const exists =
    data.brands.some(
      x =>
        x.toLowerCase()
        ===
        clean.toLowerCase()
    );


  if(exists){

    alert(
      "This brand is already in your library ♡"
    );

    return;

  }


  data.brands.push(
    clean
  );


  data.brands.sort();


  saveData();


  const input =
    document.getElementById(
      "brandInput"
    );


  if(input)
    input.value =
      clean;


  const list =
    document.getElementById(
      "brandList"
    );


  if(list){

    list.innerHTML =
      data.brands
        .map(
          b =>
            `<option value="${escapeHTML(b)}">`
        )
        .join("");

  }

}


/* =====================================================
   QUICK ADD PRODUCT TYPE
===================================================== */

function quickAddProductType(){

  const category =
    document.getElementById(
      "categorySelect"
    )?.value;


  if(!category)
    return;


  const type =
    prompt(
      `Add a new ${category} type ♡`
    );


  if(!type)
    return;


  const clean =
    type.trim();


  if(!clean)
    return;


  if(
    !data.types[
      category
    ]
  ){

    data.types[
      category
    ] = [];

  }


  const exists =
    data.types[
      category
    ]
    .some(
      x =>
        x.toLowerCase()
        ===
        clean.toLowerCase()
    );


  if(exists){

    alert(
      "This product type already exists ♡"
    );

    return;

  }


  data.types[
    category
  ].push(
    clean
  );


  data.types[
    category
  ].sort();


  saveData();


  updateTypeOptions(
    clean
  );

}

/* =====================================================
   EDIT PRODUCT
===================================================== */

function editProduct(
  id
){

  const p =
    data.products.find(
      x =>
        x.id === id
    );


  if(!p)
    return;


  closeModal();


  renderAddProduct(
    p
  );


  document
    .querySelectorAll(
      ".nav-item"
    )
    .forEach(
      item =>
        item.classList.remove(
          "active"
        )
    );


  document
    .querySelector(
      '[data-page="add"]'
    )
    ?.classList.add(
      "active"
    );

}


/* =====================================================
   DELETE PRODUCT
===================================================== */

function deleteProduct(
  id
){

  if(
    !confirm(
      "Delete this product permanently?"
    )
  )
    return;


  data.products =
    data.products.filter(
      p =>
        p.id !== id
    );


  saveData();


  closeModal();


  renderProductList(
    "All Products",
    data.products
  );

}


/* =====================================================

function closeModal(){

  document

function closeModalOutside(

  if(

}

===================================================== */

function switchSettingsTab(
  tab
){

  currentSettingsTab =
    tab;


  renderSettings();

}


/* =====================================================
   RENDER SETTINGS TAB
===================================================== */

function renderSettingsTab(){

  const el =
    document.getElementById(
      "settingsContent"
    );


  if(!el)
    return;


  if(
    currentSettingsTab ===
    "personal"
  ){

    el.innerHTML =
      settingsPersonal();

    return;

  }


  if(
    currentSettingsTab ===
    "brands"
  ){

    el.innerHTML =
      settingsBrands();

    return;

  }


  if(
    currentSettingsTab ===
    "ingredients"
  ){

    el.innerHTML =
      settingsIngredients();

    return;

  }


  if(
    currentSettingsTab ===
    "types"
  ){

    el.innerHTML =
      settingsTypes();

    return;

  }


  if(
    currentSettingsTab ===
    "app"
  ){

    el.innerHTML =
      settingsApp();

    return;

  }

}

/* =====================================================
   REMOVE INGREDIENT
===================================================== */

function removeIngredient(
  index
){

  const ingredient =
    data.ingredients[
      index
    ];


  data.ingredients.splice(
    index,
    1
  );


  data.avoidIngredients =
    data.avoidIngredients.filter(
      x =>
        normalizeIngredient(x)
        !==
        normalizeIngredient(
          ingredient
        )
    );


  saveData();


  renderSettingsTab();

}


/* =====================================================
   TOGGLE AVOID
===================================================== */

function toggleAvoid(
  ingredient
){

  const exists =
    data.avoidIngredients.some(
      x =>
        normalizeIngredient(x)
        ===
        normalizeIngredient(
          ingredient
        )
    );


  if(exists){

    data.avoidIngredients =
      data.avoidIngredients.filter(
        x =>
          normalizeIngredient(x)
          !==
          normalizeIngredient(
            ingredient
          )
      );

  }else{

    data.avoidIngredients.push(
      ingredient
    );

  }


  saveData();


  renderSettingsTab();

}

===================================================== */

function resetEverything(){

  const answer =
    prompt(
      "Type RESET to delete all Lunelle data."
    );


  if(
    answer !==
    "RESET"
  )
    return;


  localStorage.removeItem(
    STORAGE_KEY
  );


  data =
    structuredClone(
      defaultData
    );


  alert(
    "Lunelle has been reset ♡"
  );


  navigate(
    "dashboard",
    document.querySelector(
      '[data-page="dashboard"]'
    )
  );

}
