<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lunelle — My Beauty Diary</title>

<style>
:root{
  --pink:#f6c9dc;
  --pink-dark:#d98faf;
  --pink-soft:#fff0f6;
  --blue:#cfe4f7;
  --purple:#ded3f4;
  --lavender:#f4f0fb;
  --cream:#fffafd;
  --white:#fff;
  --text:#51464f;
  --muted:#9b8e99;
  --border:#eadde5;
  --green:#dcefe5;
  --green-dark:#6f987f;
  --yellow:#fff0ca;
  --red:#fde8ec;
  --red-dark:#b96c7d;
  --shadow:0 14px 35px rgba(150,120,145,.10);
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(135deg,#fff9fc 0%,#f7f3fb 48%,#f1f7fc 100%);
  color:var(--text);
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  min-height:100vh;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:255px;
  padding:30px 18px 20px;
  background:rgba(255,255,255,.86);
  backdrop-filter:blur(18px);
  border-right:1px solid rgba(234,221,229,.9);
  z-index:100;
  overflow-y:auto;
}

.sidebar-brand{
  padding:4px 10px 25px;
}

.logo{
  width:46px;
  height:46px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,var(--pink),var(--purple));
  color:white;
  font-family:Georgia,serif;
  font-size:25px;
  box-shadow:0 8px 20px rgba(217,143,175,.18);
}

.brand-name{
  margin:12px 0 2px;
  font:30px Georgia,serif;
  color:#62515e;
}

.brand-sub{
  font-size:9px;
  letter-spacing:2px;
  color:var(--muted);
}

.nav-section{
  margin:18px 0;
}

.nav-label{
  font-size:8px;
  letter-spacing:2px;
  font-weight:800;
  color:#b09fa9;
  padding:0 11px 8px;
}

.nav-btn{
  width:100%;
  border:0;
  background:transparent;
  text-align:left;
  padding:10px 12px;
  border-radius:13px;
  color:#756774;
  font-size:12px;
  display:flex;
  align-items:center;
  gap:10px;
  margin:2px 0;
  transition:.2s;
}

.nav-btn:hover{
  background:var(--pink-soft);
}

.nav-btn.active{
  background:linear-gradient(90deg,#fff0f6,#f6f1fc);
  color:#9a5e79;
  font-weight:700;
}

.nav-icon{
  width:18px;
  text-align:center;
}

.sidebar-footer{
  padding:20px 10px 5px;
  color:#b2a3ad;
  font-size:8px;
  letter-spacing:1px;
  text-align:center;
}

/* =========================================================
   MOBILE
========================================================= */

.mobile-topbar{
  display:none;
}

.sidebar-overlay{
  display:none;
}

/* =========================================================
   MAIN
========================================================= */

.main{
  margin-left:255px;
  min-height:100vh;
  padding:38px 42px 60px;
}

.page-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:20px;
  margin-bottom:30px;
}

.eyebrow{
  font-size:8px;
  letter-spacing:3px;
  color:var(--pink-dark);
  font-weight:800;
}

h1{
  font:42px Georgia,serif;
  margin:7px 0 3px;
  color:#5b4b58;
}

.page-sub{
  font-size:12px;
  color:var(--muted);
}

.header-actions{
  display:flex;
  gap:8px;
}

.btn{
  border:1px solid var(--border);
  background:white;
  color:#735f6c;
  padding:10px 15px;
  border-radius:12px;
  font-size:11px;
  font-weight:700;
  box-shadow:0 5px 15px rgba(130,100,120,.06);
}

.btn.primary{
  background:linear-gradient(135deg,#f5c5da,#d9c8ef);
  border-color:transparent;
  color:white;
}

.btn.danger{
  background:#fff1f3;
  color:#b76b79;
  border-color:#f1ccd3;
}

/* =========================================================
   PANELS
========================================================= */

.panel{
  background:rgba(255,255,255,.84);
  border:1px solid var(--border);
  border-radius:20px;
  padding:22px;
  box-shadow:var(--shadow);
  margin-bottom:18px;
}

.panel-title{
  font-size:10px;
  letter-spacing:2px;
  font-weight:900;
  color:#806b78;
  margin-bottom:16px;
}

.empty-state{
  text-align:center;
  padding:45px 20px;
  color:var(--muted);
  font-size:12px;
}

/* =========================================================
   DASHBOARD
========================================================= */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:25px;
}

.stat{
  background:rgba(255,255,255,.82);
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;
  box-shadow:var(--shadow);
}

.stat-label{
  font-size:8px;
  letter-spacing:1.8px;
  color:var(--muted);
  font-weight:800;
}

.stat-value{
  font:28px Georgia,serif;
  margin-top:8px;
  color:#64515e;
}

.stat-note{
  font-size:9px;
  color:#a99ba4;
  margin-top:3px;
}

/* =========================================================
   PRODUCTS
========================================================= */

.product-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
}

.product-card{
  background:white;
  border:1px solid var(--border);
  border-radius:17px;
  padding:16px;
  cursor:pointer;
  transition:.2s;
  min-width:0;
}

.product-card:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 25px rgba(120,90,110,.10);
}

.product-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.product-name{
  font-weight:800;
  font-size:13px;
  line-height:1.35;
}

.product-brand{
  font-size:9px;
  color:var(--muted);
  margin-top:3px;
}

.badge{
  font-size:8px;
  font-weight:800;
  padding:5px 8px;
  border-radius:99px;
  white-space:nowrap;
}

.badge.yes{
  background:#e5f4eb;
  color:#5f9476;
}

.badge.maybe{
  background:#fff3d6;
  color:#a9853c;
}

.badge.no{
  background:#fde8ec;
  color:#b96c7d;
}

.badge.open{
  background:#edf3fa;
  color:#7193b0;
}

.badge.finished{
  background:#e7f2ed;
  color:#69947d;
}

.badge.decluttered{
  background:#f1edf5;
  color:#92839b;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:12px;
}

.meta-chip{
  background:#faf6f9;
  border:1px solid #eee5eb;
  border-radius:8px;
  padding:5px 7px;
  font-size:8px;
  color:#897a84;
}

.card-bottom{
  border-top:1px dashed var(--border);
  margin-top:13px;
  padding-top:11px;
  font-size:9px;
  color:var(--muted);
}

.shade-line{
  font-size:9px;
  margin-top:8px;
  color:#806b78;
}

.buy-line{
  margin-top:7px;
  font-weight:700;
  color:#7a6672;
}

/* =========================================================
   FORMS
========================================================= */

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:17px;
}

.form-group.full{
  grid-column:1/-1;
}

.form-label{
  display:block;
  font-size:9px;
  letter-spacing:1px;
  text-transform:uppercase;
  color:#85727e;
  font-weight:800;
  margin-bottom:7px;
}

.optional{
  font-size:8px;
  color:#aaa0a7;
  text-transform:none;
  letter-spacing:0;
  font-weight:500;
}

input[type=text],
input[type=date],
input[type=number],
select,
textarea{
  width:100%;
  border:1px solid var(--border);
  background:#fffdfd;
  color:var(--text);
  border-radius:11px;
  padding:11px 12px;
  outline:none;
  font-size:11px;
}

textarea{
  min-height:105px;
  resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#d9b6ca;
  box-shadow:0 0 0 3px rgba(246,201,220,.18);
}

.inline-field{
  display:flex;
  gap:7px;
}

.inline-field > *{
  min-width:0;
}

.inline-field input,
.inline-field .search-wrap{
  flex:1;
}

.inline-add{
  width:40px;
  flex:0 0 40px;
  border:1px solid var(--border);
  background:#fff0f6;
  color:#a45f7d;
  border-radius:10px;
  font-size:16px;
}

.search-wrap{
  position:relative;
}

.suggest-box{
  display:none;
  position:absolute;
  left:0;
  right:0;
  top:calc(100% + 4px);
  z-index:30;
  background:white;
  border:1px solid var(--border);
  border-radius:11px;
  padding:5px;
  box-shadow:0 12px 25px rgba(90,70,85,.12);
  max-height:180px;
  overflow:auto;
}

.suggest-box.show{
  display:block;
}

.suggest-item{
  padding:8px 9px;
  border-radius:8px;
  font-size:10px;
  cursor:pointer;
}

.suggest-item:hover,
.suggest-item.highlighted{
  background:var(--pink-soft);
}

.radio-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.radio-option input{
  display:none;
}

.radio-option label{
  display:block;
  padding:10px 15px;
  border:1px solid var(--border);
  border-radius:11px;
  background:white;
  font-size:10px;
  cursor:pointer;
}

.radio-option input:checked+label{
  background:#fff0f6;
  border-color:#e3b3c8;
  color:#a35f7c;
  font-weight:800;
}

.checkbox-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}

.check-option input{
  display:none;
}

.check-option label{
  display:block;
  border:1px solid var(--border);
  border-radius:10px;
  padding:9px 10px;
  background:white;
  font-size:10px;
  cursor:pointer;
}

.check-option input:checked+label{
  background:#f3effa;
  border-color:#cdbce5;
  color:#79669a;
  font-weight:700;
}

.shade-section{
  display:none;
  padding:15px;
  background:#fbf7fb;
  border:1px solid #eee3eb;
  border-radius:14px;
}

.shade-section.show{
  display:block;
}

.status-extra{
  display:none;
  margin-top:9px;
}

.status-extra.show{
  display:block;
}

.usage-summary{
  display:none;
  margin-top:10px;
  padding:10px 12px;
  background:#eef8f2;
  border-radius:10px;
  color:#638773;
  font-size:10px;
}

.usage-summary.show{
  display:block;
}

.buy-again-wrap{
  display:none;
  margin-top:12px;
}

.buy-again-wrap.show{
  display:block;
}

.form-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:20px;
}

/* =========================================================
   PROFILE
========================================================= */

.profile-layout{
  display:grid;
  grid-template-columns:1fr 1.2fr;
  gap:18px;
}

.profile-card{
  background:white;
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
}

.profile-row{
  display:flex;
  justify-content:space-between;
  gap:20px;
  padding:11px 0;
  border-bottom:1px dashed var(--border);
}

.profile-row:last-child{
  border-bottom:0;
}

.profile-key{
  font-size:9px;
  color:var(--muted);
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:1px;
}

.profile-value{
  text-align:right;
  font-size:11px;
  font-weight:700;
}

.condition-tags{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.tag{
  background:#f7f1fa;
  border:1px solid #e8ddef;
  color:#806b91;
  padding:6px 8px;
  border-radius:99px;
  font-size:9px;
}

.shade-match{
  padding:12px 0;
  border-bottom:1px dashed var(--border);
}

.shade-match:last-child{
  border-bottom:0;
}

.shade-match strong{
  font-size:11px;
}

.shade-match small{
  display:block;
  color:var(--muted);
  font-size:9px;
  margin-top:3px;
}

/* =========================================================
   SETTINGS
========================================================= */

.settings-tabs{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-bottom:5px;
  margin-bottom:18px;
}

.settings-tab{
  border:1px solid var(--border);
  background:white;
  border-radius:99px;
  padding:9px 15px;
  font-size:10px;
  color:#816e7b;
  white-space:nowrap;
}

.settings-tab.active{
  background:#fff0f6;
  color:#a35f7c;
  border-color:#e7b8cb;
  font-weight:800;
}

.setting-panel{
  display:none;
}

.setting-panel.active{
  display:block;
}

.manage-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.manage-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  border:1px solid var(--border);
  border-radius:11px;
  padding:10px 12px;
  background:white;
  font-size:10px;
}

.remove-mini{
  border:0;
  background:#fff0f3;
  color:#b76f7e;
  border-radius:7px;
  padding:5px 8px;
  font-size:9px;
}

/* =========================================================
   MODAL
========================================================= */

.modal-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(68,52,66,.28);
  z-index:200;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-overlay.show{
  display:flex;
}

.modal{
  width:min(650px,100%);
  max-height:90vh;
  overflow:auto;
  background:#fffafd;
  border:1px solid var(--border);
  border-radius:22px;
  padding:24px;
  box-shadow:0 25px 70px rgba(70,50,70,.2);
}

.modal-head{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:flex-start;
}

.close{
  border:0;
  background:#f7eef4;
  border-radius:50%;
  width:32px;
  height:32px;
  color:#806d79;
}

.detail-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:18px 0;
}

.detail{
  background:white;
  border:1px solid var(--border);
  border-radius:11px;
  padding:11px;
}

.detail small{
  display:block;
  color:var(--muted);
  font-size:8px;
  text-transform:uppercase;
  letter-spacing:1px;
}

.detail strong{
  display:block;
  margin-top:5px;
  font-size:10px;
}

.modal-notes{
  background:#fff5f9;
  border-radius:12px;
  padding:13px;
  font-size:10px;
  line-height:1.6;
}

.modal-actions{
  display:flex;
  gap:8px;
  justify-content:flex-end;
  margin-top:18px;
}

/* =========================================================
   TOAST
========================================================= */

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#665564;
  color:white;
  padding:11px 15px;
  border-radius:12px;
  font-size:10px;
  z-index:500;
  opacity:0;
  transform:translateY(10px);
  pointer-events:none;
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translateY(0);
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:768px){

  .sidebar{
    width:275px;
    transform:translateX(-105%);
    transition:transform .25s ease;
    box-shadow:15px 0 40px rgba(70,50,70,.13);
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .sidebar-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(50,40,50,.22);
    z-index:90;
  }

  .sidebar-overlay.show{
    display:block;
  }

  .mobile-topbar{
    display:flex;
    position:sticky;
    top:0;
    z-index:80;
    height:62px;
    align-items:center;
    justify-content:flex-start;
    padding:0 15px;
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
  }

  .hamburger{
    width:40px;
    height:40px;
    border:1px solid var(--border);
    border-radius:12px;
    background:white;
    color:#866e7c;
    font-size:20px;
    display:grid;
    place-items:center;
  }

  .mobile-title{
    margin-left:11px;
    font:20px Georgia,serif;
    color:#655461;
  }

  .main{
    margin-left:0;
    padding:24px 15px 45px;
  }

  .page-header{
    align-items:flex-start;
    margin-bottom:20px;
  }

  .page-header .header-actions{
    display:none;
  }

  h1{
    font-size:32px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .product-grid{
    grid-template-columns:1fr;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .form-group.full{
    grid-column:auto;
  }

  .profile-layout{
    grid-template-columns:1fr;
  }

  .checkbox-grid{
    grid-template-columns:1fr;
  }

  .inline-field{
    flex-wrap:wrap;
  }

  .inline-field .btn{
    width:100%;
  }
}
</style>
</head>

<body>

<div class="app">

  <div
    class="sidebar-overlay"
    id="sidebarOverlay"
  ></div>

  <aside
    class="sidebar"
    id="sidebar"
  >

    <div class="sidebar-brand">

      <div class="logo">L</div>

      <div class="brand-name">
        Lunelle
      </div>

      <div class="brand-sub">
        MY BEAUTY DIARY ♡
      </div>

    </div>


    <div class="nav-section">

      <div class="nav-label">
        MY SPACE
      </div>

      <button class="nav-btn active" data-page="dashboard">
        <span class="nav-icon">⌂</span>
        Dashboard
      </button>

      <button class="nav-btn" data-page="all">
        <span class="nav-icon">♡</span>
        All Products
      </button>

      <button class="nav-btn" data-page="add">
        <span class="nav-icon">＋</span>
        Add Product
      </button>

    </div>


    <div class="nav-section">

      <div class="nav-label">
        MY LISTS
      </div>

      <button class="nav-btn" data-page="yes">
        <span class="nav-icon">♡</span>
        YES List
      </button>

      <button class="nav-btn" data-page="maybe">
        <span class="nav-icon">✦</span>
        MAYBE List
      </button>

      <button class="nav-btn" data-page="no">
        <span class="nav-icon">×</span>
        NO List
      </button>

      <button class="nav-btn" data-page="empties">
        <span class="nav-icon">○</span>
        EMPTIES
      </button>

    </div>


    <div class="nav-section">

      <div class="nav-label">
        MY DETAILS
      </div>

      <button class="nav-btn" data-page="profile">
        <span class="nav-icon">♧</span>
        My Profile
      </button>

      <button class="nav-btn" data-page="avoid">
        <span class="nav-icon">!</span>
        What Should I Avoid?
      </button>

      <button class="nav-btn" data-page="ingredients">
        <span class="nav-icon">✿</span>
        My Ingredients
      </button>

    </div>


    <div class="nav-section">

      <div class="nav-label">
        MORE
      </div>

      <button class="nav-btn" data-page="settings">
        <span class="nav-icon">⚙</span>
        Settings
      </button>

    </div>


    <div class="sidebar-footer">
      © 2026 Cytara™
    </div>

  </aside>


  <div class="mobile-topbar">

    <button
      class="hamburger"
      id="hamburger"
      aria-label="Open menu"
    >
      ☰
    </button>

    <div class="mobile-title">
      Lunelle
    </div>

  </div>


  <main
    class="main"
    id="main"
  ></main>

</div>


<div
  class="modal-overlay"
  id="modalOverlay"
>
  <div
    class="modal"
    id="modalContent"
  ></div>
</div>


<div
  class="toast"
  id="toast"
></div>


<script>

/* =========================================================
   LUNELLE BEAUTY DIARY
========================================================= */

const STORAGE_KEY =
  "lunelle_beauty_diary_v7";


const DEFAULTS = {

  profile:{
    name:"",
    age:"",
    skinType:"",
    skinConditions:[],
    skinTone:"",
    personalColor:[]
  },

  brands:[
    "Laneige",
    "SK-II",

function clone(obj){

  return JSON.parse(
    JSON.stringify(obj)
  );

}


function loadData(){

  try{

    const saved =
      JSON.parse(
        localStorage.getItem(
          STORAGE_KEY
        )
      );

    if(!saved){

      return clone(DEFAULTS);

    }

    return {

      ...clone(DEFAULTS),

      ...saved,

      profile:{
        ...clone(DEFAULTS.profile),
        ...(saved.profile || {})
      },

      brands:
        Array.isArray(saved.brands)
          ? saved.brands
          : clone(DEFAULTS.brands),

      categories:
        Array.isArray(saved.categories)
          ? saved.categories
          : clone(DEFAULTS.categories),

      types:{
        ...clone(DEFAULTS.types),
        ...(saved.types || {})
      },

      avoidIngredients:
        Array.isArray(
          saved.avoidIngredients
        )
          ? saved.avoidIngredients
          : [],

      products:
        Array.isArray(saved.products)
          ? saved.products
          : []

    };

  }catch(e){

    return clone(DEFAULTS);

  }

}


function saveData(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );

}


function esc(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    char => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[char])
  );

}


function normalize(value){

  return String(
    value || ""
  )
  .trim()
  .toLowerCase();

}


function uid(){

  return (
    Date.now().toString(36)
    +
    Math.random()
      .toString(36)
      .slice(2,8)
  );

}


function formatDate(value){

  if(!value){
    return "—";
  }

  const d =
    new Date(
      value + "T00:00:00"
    );

  if(isNaN(d)){
    return "—";
  }

  return d.toLocaleDateString(
    "en-GB",
    {
      day:"2-digit",
      month:"short",
      year:"numeric"
    }
  );

}


function daysBetween(
  start,
  end
){

  if(!start || !end){
    return null;
  }

  const a =
    new Date(
      start + "T00:00:00"
    );

  const b =
    new Date(
      end + "T00:00:00"
    );

  if(
    isNaN(a) ||
    isNaN(b)
  ){
    return null;
  }

  return Math.max(
    0,
    Math.floor(
      (b-a)/86400000
    )
  );

}


function formatDuration(days){

  if(
    days === null ||
    days === undefined
  ){
    return "—";
  }

  if(days < 30){

    return (
      days +
      " day" +
      (days === 1 ? "" : "s")
    );

  }

  const months =
    Math.floor(
      days / 30.4375
    );

  if(months < 12){

    return (
      months +
      " month" +
      (months === 1 ? "" : "s")
    );

  }

  const years =
    Math.floor(
      months / 12
    );

  const remainder =
    months % 12;

  return (
    years +
    " year" +
    (years === 1 ? "" : "s") +
    (
      remainder
        ? " " +
          remainder +
          " month" +
          (remainder === 1 ? "" : "s")
        : ""
    )
  );

}


function productDuration(p){

  if(
    !p.openedOn ||
    !p.emptyOn
  ){

    return "—";

  }

  return formatDuration(
    daysBetween(
      p.openedOn,
      p.emptyOn
    )
  );

}

function navigate(page){

  currentPage =
    page;

  editingId =
    null;

  render();

  closeSidebar();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function render(){

  const main =
    document.getElementById(
      "main"
    );


  if(currentPage === "dashboard"){

    main.innerHTML =
      renderDashboard();

  }

  else if(currentPage === "all"){

    main.innerHTML =
      renderProductList(
        "All Products",
        data.products
      );

  }

  else if(currentPage === "yes"){

    main.innerHTML =
      renderProductList(
        "YES List",
        data.products.filter(
          p => p.result === "yes"
        )
      );

  }

  else if(currentPage === "maybe"){

    main.innerHTML =
      renderProductList(
        "MAYBE List",
        data.products.filter(
          p => p.result === "maybe"
        )
      );

  }

  else if(currentPage === "no"){

    main.innerHTML =
      renderProductList(
        "NO List",
        data.products.filter(
          p => p.result === "no"
        )
      );

  }

  else if(currentPage === "empties"){

    main.innerHTML =
      renderProductList(
        "EMPTIES",
        data.products.filter(
          p => p.status === "finished"
        )
      );

  }

  else if(currentPage === "add"){

    main.innerHTML =
      renderProductForm();

  }

  else if(currentPage === "profile"){

    main.innerHTML =
      renderProfile();

  }

  else if(currentPage === "avoid"){

    main.innerHTML =
      renderAvoid();

  }

  else if(currentPage === "ingredients"){

    main.innerHTML =
      renderIngredients();

  }

  else if(currentPage === "settings"){

    main.innerHTML =
      renderSettings();

  }

  bindPageEvents();

  updateNav();

}


function updateNav(){

  document
    .querySelectorAll(
      ".nav-btn"
    )
    .forEach(
      button => {

        button.classList.toggle(
          "active",
          button.dataset.page ===
          currentPage
        );

      }
    );

}


document

  .forEach(

function statusBadge(status){

  const labels = {

    opened:"Opened",

    status === "finished"

        ? "decluttered"
        : "open";

  return `

      ${labels[status] || "—"}
    </span>
  `;

}

function bindPageEvents(){

  const form =
    document.getElementById(
      "productForm"
    );


  if(form){

    bindSearch(
      "brandInput",
      "brandSuggestions",
      () => data.brands
    );


    bindSearch(
      "categoryInput",
      "categorySuggestions",
      () => data.categories
    );


    bindSearch(
      "typeInput",
      "typeSuggestions",
      () => {

        const category =
          document
            .getElementById(
              "categoryInput"
            )
            ?.value
            .trim();

        if(
          category &&
          data.types[category]
        ){

          return data.types[category];

        }

        return Object.values(
          data.types
        ).flat();

      }
    );


    document
      .getElementById(
        "categoryInput"
      )
      ?.addEventListener(
        "input",
        updateShadeSection
      );


    document
      .getElementById(
        "typeInput"
      )
      ?.addEventListener(
        "input",
        updateShadeSection
      );


    document
      .getElementById(
        "ingredients"
      )
      ?.addEventListener(
        "input",
        checkIngredientWarning
      );


    document
      .getElementById(
        "status"
      )
      ?.addEventListener(
        "change",
        updateEmptyFields
      );


    document
      .getElementById(
        "openedOn"
      )
      ?.addEventListener(
        "input",
        updateUsageSummary
      );


    document
      .getElementById(
        "emptyOn"
      )
      ?.addEventListener(
        "input",
        updateUsageSummary
      );


    form.addEventListener(
      "submit",
      handleProductSubmit
    );


    /*
      Enter on normal product inputs submits.
      Enter inside Ingredients / Notes does NOT submit.
      This lets the user write naturally in textareas.
    */

    form
      .querySelectorAll(
        'input:not([type="radio"]):not([type="date"]), select'
      )
      .forEach(
        element => {

          element.addEventListener(
            "keydown",
            e => {

              if(
                e.key === "Enter" &&
                element.id !== "brandInput" &&
                element.id !== "categoryInput" &&
                element.id !== "typeInput"
              ){

                e.preventDefault();

                form.requestSubmit();

              }

            }
          );

        }
      );


    checkIngredientWarning();

  }


  /* SETTINGS TABS */

  document
    .querySelectorAll(
      ".settings-tab"
    )
    .forEach(
      tab => {

        tab.addEventListener(
          "click",
          () => {

            currentSettingsTab =
              tab.dataset.tab;

            render();

          }
        );

      }
    );


  /* PERSONAL */

  const personalForm =
    document.getElementById(
      "personalForm"
    );

  if(personalForm){

    personalForm.addEventListener(
      "submit",
      savePersonal
    );

    /*
      Enter inside Personal inputs
      saves immediately.
      Checkboxes naturally don't need Enter.
    */

    personalForm
      .querySelectorAll(
        'input[type="text"], input[type="number"], select'
      )
      .forEach(
        element => {

          element.addEventListener(
            "keydown",
            e => {

              if(
                e.key === "Enter"
              ){

                e.preventDefault();

                personalForm.requestSubmit();

              }

            }
          );

        }
      );

  }


  /* LANGUAGE */

  const language =
    document.getElementById(
      "languageSetting"
    );

  if(language){

    language.addEventListener(
      "change",
      e => {

        data.language =
          e.target.value;

        saveData();

        toast(
          "Language preference saved."
        );

      }
    );

  }


  /*
    SETTINGS ENTER SHORTCUTS

    Brands:
      Enter = add

    Ingredients:
      Enter = add

    Types:
      Enter in Type field = add
      Enter in Category field only does not add
      because Type is still missing.
  */

  const newBrand =
    document.getElementById(
      "newBrand"
    );

  if(newBrand){

    newBrand.addEventListener(
      "keydown",
      e => {

        if(
          e.key === "Enter"
        ){

          e.preventDefault();

          addBrandFromSettings();

        }

      }
    );

  }


  const newAvoid =
    document.getElementById(
      "newAvoid"
    );

  if(newAvoid){

    newAvoid.addEventListener(
      "keydown",
      e => {

        if(
          e.key === "Enter"
        ){

          e.preventDefault();

          addAvoidFromSettings();

        }

      }
    );

  }


  const newTypeCategory =
    document.getElementById(
      "newTypeCategory"
    );

  const newTypeName =
    document.getElementById(
      "newTypeName"
    );


  if(newTypeCategory){

    newTypeCategory.addEventListener(
      "keydown",
      e => {

        if(
          e.key === "Enter"
        ){

          e.preventDefault();

          if(
            newTypeName &&
            newTypeName.value.trim()
          ){

            addTypeFromSettings();

          }else{

            newTypeName?.focus();

          }

        }

      }
    );

  }


  if(newTypeName){

    newTypeName.addEventListener(
      "keydown",
      e => {

        if(
          e.key === "Enter"
        ){

          e.preventDefault();

          addTypeFromSettings();

        }

      }
    );

  }

/* =========================================================
   SEARCHABLE INPUTS
========================================================= */

function bindSearch(
  inputId,
  boxId,
  getItems
){

  const input =
    document.getElementById(
      inputId
    );

  const box =
    document.getElementById(
      boxId
    );

  if(!input || !box){
    return;
  }


  let highlightedIndex =
    -1;


  function getSuggestionItems(){

    return [
      ...box.querySelectorAll(
        ".suggest-item"
      )
    ];

  }


  function updateHighlight(){

    const items =
      getSuggestionItems();


    items.forEach(
      (item,index) => {

        item.classList.toggle(
          "highlighted",
          index ===
          highlightedIndex
        );

      }
    );

  }


  function chooseSuggestion(
    item
  ){

    if(!item){
      return;
    }

    input.value =
      item.dataset.value;

    box.classList.remove(
      "show"
    );

    highlightedIndex =
      -1;

    updateShadeSection();

  }


  function showSuggestions(){

    const query =
      normalize(
        input.value
      );


    const items =
      [
        ...new Set(
          getItems()
            .filter(Boolean)
        )
      ];


    const filtered =
      items
        .filter(
          item =>
            !query ||
            normalize(item)
              .includes(query)
        )
        .sort(
          (a,b) => {

            if(!query){

              return a.localeCompare(b);

            }

            const aa =
              normalize(a);

            const bb =
              normalize(b);

            const aStarts =
              aa.startsWith(query);

            const bStarts =
              bb.startsWith(query);

            if(
              aStarts &&
              !bStarts
            ){

              return -1;

            }

            if(
              !aStarts &&
              bStarts
            ){

              return 1;

            }

            return aa.localeCompare(bb);

          }
        )
        .slice(0,10);


    box.innerHTML =
      filtered
        .map(
          item =>
            `
            <div
              class="suggest-item"
              data-value="${esc(item)}"
            >
              ${esc(item)}
            </div>
            `
        )
        .join("");


    if(
      query &&
      !items.some(
        item =>
          normalize(item) ===
          query
      )
    ){

      box.innerHTML += `

        <div
          class="suggest-item"
          data-value="${esc(
            input.value.trim()
          )}"
        >
          ＋ Use
          “${esc(input.value.trim())}”
        </div>

      `;

    }


    highlightedIndex =
      -1;


    box.classList.toggle(
      "show",
      filtered.length > 0 ||
      Boolean(query)
    );


    box
      .querySelectorAll(
        ".suggest-item"
      )
      .forEach(
        item => {

          item.addEventListener(
            "mousedown",
            e => {

              e.preventDefault();

              chooseSuggestion(
                item
              );

            }
          );

        }
      );

  }


  input.addEventListener(
    "focus",
    showSuggestions
  );


  input.addEventListener(
    "input",
    showSuggestions
  );


  /*
    ENTER IN SEARCHABLE FIELD:

    If suggestions exist:
      Enter chooses the highlighted/top suggestion.

    If there is no suggestion:
      Enter lets the normal product form submit.
  */

  input.addEventListener(
    "keydown",
    e => {

      if(
        e.key === "ArrowDown"
      ){

        const items =
          getSuggestionItems();

        if(!items.length){
          return;
        }

        e.preventDefault();

        highlightedIndex =
          Math.min(
            highlightedIndex + 1,
            items.length - 1
          );

        updateHighlight();

      }


      else if(
        e.key === "ArrowUp"
      ){

        const items =
          getSuggestionItems();

        if(!items.length){
          return;
        }

        e.preventDefault();

        highlightedIndex =
          Math.max(
            highlightedIndex - 1,
            0
          );

        updateHighlight();

      }


      else if(
        e.key === "Enter"
      ){

        const items =
          getSuggestionItems();

        if(
          box.classList.contains(
            "show"
          ) &&
          items.length
        ){

          e.preventDefault();

          chooseSuggestion(
            items[
              highlightedIndex >= 0
                ? highlightedIndex
                : 0
            ]
          );

        }

      }

    }
  );


  document.addEventListener(
    "click",
    e => {

      if(
        !input.parentElement.contains(
          e.target
        )
      ){

        box.classList.remove(
          "show"
        );

        highlightedIndex =
          -1;

      }

    }
  );

}

function isShadeEligible(p){

  const type =
    normalize(
      p.productType
    );

  return (
    normalize(p.category) ===
    "makeup"
    ||
    SHADE_TYPES.some(
      x =>
        normalize(x) ===
        type
    )
  );

}


function updateShadeSection(){

  const category =
    normalize(
      document
        .getElementById(
          "categoryInput"
        )
        ?.value
    );


  const type =
    normalize(
      document
        .getElementById(
          "typeInput"
        )
        ?.value
    );


  const show =
    category === "makeup"
    ||
    SHADE_TYPES.some(
      x =>
        normalize(x) ===
        type
    );


  document
    .getElementById(
      "shadeMatchSection"
    )
    ?.classList.toggle(
      "show",
      show
    );

}


/* =========================================================
   INGREDIENT WARNING
========================================================= */

function checkIngredientWarning(){

  const warning =
    document.getElementById(
      "ingredientWarning"
    );

  if(!warning){
    return;
  }


  const ingredients =
    String(
      document
        .getElementById(
          "ingredients"
        )
        .value || ""
    )
    .split(/[,;\n]+/)
    .map(normalize)
    .filter(Boolean);


  const matches =
    data.avoidIngredients.filter(
      ingredient =>
        ingredients.includes(
          normalize(ingredient)
        )
    );


  if(matches.length){

    warning.style.display =
      "block";

    warning.innerHTML =
      "⚠ Avoid ingredient found: " +
      "<strong>" +
      matches
        .map(esc)
        .join(", ") +
      "</strong>";

  }else{

    warning.style.display =
      "none";

  }

}

function updateUsageSummary(){

  const status =
    document
      .getElementById(
        "status"
      )
      ?.value;

  const opened =
    document
      .getElementById(
        "openedOn"
      )
      ?.value;

  const empty =

      )
      ?.value;


  const summary =
    document.getElementById(
      "usageSummary"
    );

  const buy =
    document.getElementById(
      "buyAgainWrap"
    );


  if(!summary || !buy){
    return;
  }


  if(
    status === "finished" &&
    empty
  ){

    summary.classList.add(
      "show"
    );


    if(opened){

      const days =
        daysBetween(
          opened,
          empty
        );


      summary.innerHTML =
        `
        Usage duration:
        <strong>
          ${formatDuration(days)}
        </strong>
        `;

    }else{

      summary.innerHTML =
        `
        Usage duration:
        <strong>
          Add Opened On to calculate.
        </strong>
        `;

    }


    buy.classList.add(
      "show"
    );

  }else{

    summary.classList.remove(
      "show"
    );

    buy.classList.remove(
      "show"
    );

  }

}

/* =========================================================
   SAVE PRODUCT
========================================================= */

function handleProductSubmit(e){

  e.preventDefault();


  const name =
    document
      .getElementById(
        "productName"
      )
      .value
      .trim();


  const brand =
    document
      .getElementById(
        "brandInput"
      )
      .value
      .trim();


  const category =
    document
      .getElementById(
        "categoryInput"
      )
      .value
      .trim();


  const productType =
    document
      .getElementById(
        "typeInput"
      )
      .value
      .trim();


  const ingredients =
    document
      .getElementById(
        "ingredients"
      )
      .value
      .trim();


  const shade =
    document
      .getElementById(
        "shadeInput"
      )
      .value
      .trim();


  const openedOn =
    document
      .getElementById(
        "openedOn"
      )
      .value;


  const status =
    document
      .getElementById(
        "status"
      )
      .value;


  const emptyOn =
    document
      .getElementById(
        "emptyOn"
      )
      ?.value || "";


  const result =
    getRadio("result");


  const shadeMatch =
    getRadio("shadeMatch");


  const buyAgain =
    getRadio("buyAgain");


  if(!name || !category){

    toast(
      "Please complete Product Name and Category."
    );

    return;

  }


  if(status === "finished"){

    if(!emptyOn){

      toast(
        "Finished / Empty needs an Empty On date."
      );

      return;

    }


    if(
      openedOn &&
      new Date(emptyOn) <
      new Date(openedOn)
    ){

      toast(
        "Empty On cannot be before Opened On."
      );

      return;

    }


    if(!buyAgain){

      toast(
        "Please choose Would You Buy It Again?"
      );

      return;

    }

  }


  /* AUTO-SAVE CATEGORY */

  if(
    !data.categories.some(
      x =>
        normalize(x) ===
        normalize(category)
    )
  ){

    data.categories.push(
      category
    );

  }


  /* AUTO-SAVE BRAND */

  if(
    brand &&
    !data.brands.some(
      x =>
        normalize(x) ===
        normalize(brand)
    )
  ){

    data.brands.push(
      brand
    );

  }


  /* AUTO-SAVE TYPE */

  if(productType){

    if(!data.types[category]){

      data.types[category] =
        [];

    }


    if(
      !data.types[category].some(
        x =>
          normalize(x) ===
          normalize(productType)
      )
    ){

      data.types[category].push(
        productType
      );

    }

  }


  const product = {

    id:
      editingId ||
      uid(),

    name,

    brand,

    category,

    productType,

    ingredients,

    shade,

    shadeMatch,

    openedOn,

    status,

    emptyOn,

    buyAgain:
      status === "finished"
        ? buyAgain
        : "",

    result:
      result || "yes",

    notes:
      document
        .getElementById(
          "notes"
        )
        .value
        .trim(),

    updatedAt:
      new Date()
        .toISOString()

  };


  const existingIndex =
    data.products.findIndex(
      x =>
        x.id === product.id
    );


  if(existingIndex >= 0){

    data.products[
      existingIndex
    ] = product;

  }else{

    data.products.push(
      product
    );

  }


  saveData();


  /*
    STAY ON CURRENT PAGE.

    Editing:
      remain on Edit Product.

    Adding:
      remain on Add Product.
      Clear the form.
  */

  if(editingId){

    toast(
      "Product updated ♡"
    );

    render();

  }else{

    toast(
      "Product saved ♡"
    );

    render();

    /*
      Since Add Product stays open,
      focus Product Name so the user
      can immediately type the next product.
    */

    setTimeout(
      () => {

        document
          .getElementById(
            "productName"
          )
          ?.focus();

      },
      50
    );

  }

}

      .filter(Boolean)
      .forEach(
        ingredient => {

          const key =
            normalize(
              ingredient
            );


          if(!counts[key]){

            counts[key] = {
              name:ingredient,
              count:0
            };

          }


          counts[key].count++;

        }
      );

    }
  );


  const list =
    Object.values(
      counts
    )
    .sort(
      (a,b) =>
        b.count -
        a.count
    );


  return (

    header(
      "My Ingredients",
      "A simple inventory of ingredients appearing in your beauty diary."
    )

    +

    `

    <div class="panel">

      ${
        list.length

          ? `
            <div class="manage-list">

              ${
                list
                  .map(
                    item =>
                      `
                      <div class="manage-item">

                        <span>
                          ${esc(item.name)}
                        </span>

                        <span class="tag">
                          ${item.count}
                          product${item.count===1?"":"s"}
                        </span>

                      </div>
                      `
                  )
                  .join("")
              }

            </div>
          `

          : `
            <div
              class="empty-state"
              style="padding:25px"
            >
              Add ingredients to your products
              to build this list.
            </div>
          `
      }

    </div>

    `

  );

}

/* =========================================================

========================================================= */

function savePersonal(e){

  e.preventDefault();


  data.profile.name =
    document
      .getElementById(
        "profileName"
      )
      .value
      .trim();


  data.profile.age =
    document
      .getElementById(
        "profileAge"
      )
      .value;


  data.profile.skinType =
    document
      .getElementById(
        "profileSkinType"
      )
      .value;


  data.profile.skinTone =
    document
      .getElementById(
        "profileSkinTone"
      )
      .value;


  data.profile.skinConditions =
    [
      ...document
        .querySelectorAll(
          'input[name="skinCondition"]:checked'
        )
    ]
    .map(
      input =>
        input.value
    );


  data.profile.personalColor =
    [
      ...document
        .querySelectorAll(
          'input[name="personalColor"]:checked'
        )
    ]
    .map(
      input =>
        input.value
    );


  saveData();


  /*
    IMPORTANT:
    stay on Personal.
  */

  currentPage =
    "settings";

  currentSettingsTab =
    "personal";

  render();

  toast(
    "Personal details saved ♡"
  );

}


/* =========================================================
   ADD BRAND FROM SETTINGS
========================================================= */

function addBrandFromSettings(){

  const input =
    document.getElementById(
      "newBrand"
    );


  const brand =
    input.value.trim();


  if(!brand){

    toast(
      "Enter a brand name first."
    );

    input.focus();

    return;

  }


  if(
    data.brands.some(
      x =>
        normalize(x) ===
        normalize(brand)
    )
  ){

    toast(
      "That brand already exists."
    );

    input.select();

    return;

  }


  data.brands.push(
    brand
  );


  saveData();


  /*
    STAY:
      Settings → Brands
  */

  currentPage =
    "settings";

  currentSettingsTab =
    "brands";

  render();

  toast(
    "Brand added ♡"
  );


  /*
    Focus the same Add Brand field
    after rerender so the user can
    immediately type another one.
  */

  setTimeout(
    () => {

      document
        .getElementById(
          "newBrand"
        )
        ?.focus();

    },
    50
  );

}


/* =========================================================
   REMOVE BRAND
========================================================= */

function removeBrand(index){

  const brand =
    data.brands[index];


  if(!brand){
    return;
  }


  if(
    !confirm(
      `Remove "${brand}" from the brand library?`
    )
  ){

    return;

  }


  data.brands.splice(
    index,
    1
  );


  saveData();


  /*
    STAY:
      Settings → Brands
  */

  currentPage =
    "settings";

  currentSettingsTab =
    "brands";

  render();

  toast(
    "Brand removed."
  );

}

/* =========================================================
   ADD TYPE
========================================================= */

function addTypeFromSettings(){

  const categoryInput =
    document.getElementById(
      "newTypeCategory"
    );

  const typeInput =
    document.getElementById(
      "newTypeName"
    );


  const category =
    categoryInput.value.trim();

  const type =
    typeInput.value.trim();


  if(!category){

    toast(
      "Enter a category first."
    );

    categoryInput.focus();

    return;

  }


  if(!type){

    toast(
      "Enter a product type."
    );

    typeInput.focus();

    return;

  }


  if(
    !data.categories.some(
      x =>
        normalize(x) ===
        normalize(category)
    )
  ){

    data.categories.push(
      category
    );

  }


  if(
    !data.types[category]
  ){

    data.types[category] =
      [];

  }


  if(
    data.types[category].some(
      x =>
        normalize(x) ===
        normalize(type)
    )
  ){

    toast(
      "That product type already exists in this category."
    );

    typeInput.select();

    return;

  }


  data.types[category].push(
    type
  );


  saveData();


  /*
    STAY:
      Settings → Types
  */

  currentPage =
    "settings";

  currentSettingsTab =
    "types";

  render();

  toast(
    "Product type added ♡"
  );


  setTimeout(
    () => {

      document
        .getElementById(
          "newTypeName"
        )
        ?.focus();

    },
    50
  );

}


/* =========================================================
   REMOVE TYPE
========================================================= */

function removeType(
  encodedCategory,
  index
){

  const category =
    decodeURIComponent(
      encodedCategory
    );


  if(
    !data.types[category] ||
    !data.types[category][index]
  ){
    return;
  }


  data.types[category].splice(
    index,
    1
  );


  saveData();


  /*
    STAY:
      Settings → Types
  */

  currentPage =
    "settings";

  currentSettingsTab =
    "types";

  render();

  toast(
    "Product type removed."
  );

}

   EDIT PRODUCT
========================================================= */

function editProduct(id){

  previousPageBeforeEdit =
    currentPage;


  editingId =
    id;


  currentPage =
    "add";


  closeModal();

  render();

}


/* =========================================================
   DELETE PRODUCT
========================================================= */

function deleteProduct(id){

  const product =
    data.products.find(
      p =>
        p.id === id
    );


  if(!product){
    return;
  }


  if(
    !confirm(
      `Delete "${product.name}"? This cannot be undone.`
    )
  ){

    return;

  }


  data.products =
    data.products.filter(
      p =>
        p.id !== id
    );


  saveData();


  const returnPage =
    previousPageBeforeEdit ||
    "all";


  editingId =
    null;

  currentPage =
    returnPage;

  render();

  toast(
    "Product deleted."
  );

}


/* =========================================================
   RESET
========================================================= */

function resetApp(){

  const answer =
    prompt(
      "Type RESET to delete all Lunelle data from this browser."
    );


  if(
    answer !==
    "RESET"
  ){

    return;

  }


  localStorage.removeItem(
    STORAGE_KEY
  );


  data =
    clone(DEFAULTS);


  currentPage =
    "dashboard";

  currentSettingsTab =
    "personal";

  editingId =
    null;


  render();

  toast(
    "Lunelle has been reset."
  );

}

    "open"
  );

  sidebarOverlay.classList.remove(
    "show"
  );

}


document
  .getElementById(
    "hamburger"
  )
  .addEventListener(
    "click",
    openSidebar
  );


sidebarOverlay.addEventListener(
  "click",
  closeSidebar
);


/* =========================================================
   TOAST
========================================================= */

let toastTimer =
  null;


function toast(message){

  const element =
    document.getElementById(
      "toast"
    );


  element.textContent =
    message;


  element.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      () => {

        element.classList.remove(
          "show"
        );

      },
      2200
    );

}


/* =========================================================
   INITIAL LOAD
========================================================= */

render();

</script>

</body>
</html>
